:root {

  --bg: #15171a; --surface: #1c1f22; --surface-2: #23262a; --border: #33363b;

  --blue: #7fb0e8; --blue-soft: rgba(127, 176, 232, 0.14);
  /* fonts */
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  color-scheme: dark;

* { box-sizing: border-box; }

/**
 * Filter a festival object by requested tradition tags.
 * Returns the festival unchanged if no filter is requested, null if it doesn't match.
 * @param {Object|null} festival
 * @param {string[]|undefined} traditions - requested tradition tags (e.g. ['public','buddhist'])
 * @returns {Object|null}
 */
const filterFestival = (festival, traditions) => {
  if (!festival || !traditions || traditions.length === 0) return festival;
  return festival.traditions?.some((t) => traditions.includes(t)) ? festival : null;
};

/**
 * 三娘煞日 (Sanniang Sha Days) - Inauspicious days for weddings
 * Days: 3, 7, 13, 18, 22, 27 of each lunar month
 */
const SANNIANG_SHA_DAYS = [3, 7, 13, 18, 22, 27];

const SOLAR_TERM_NAMES = [
  '小寒',
  '大寒',
  '立春',
  '雨水',
  '惊蛰',
  '春分',
  '清明',
  '谷雨',
  '立夏',
  '小满',
  '芒种',
  '夏至',
  '小暑',
  '大暑',
  '立秋',
  '处暑',
  '白露',
  '秋分',
  '寒露',
  '霜降',
  '立冬',
  '小雪',
  '大雪',
  '冬至'
];

// Base date for lunar calendar calculations (Jan 31, 1900)
const BASE_DATE = new Date(1900, 0, 31);

// Constant for date calculations (24 * 60 * 60 * 1000)
const MILLISECONDS_PER_DAY = 86400000;

// ===== UTILITY FUNCTIONS =====

/**
 * Check if a value is a valid Date
 */
const isValidDate = (date) => date instanceof Date && !Number.isNaN(date.getTime());

/**
 * Supported year range, bounded by the LUNAR_INFO lookup table (1900-2100).
 * Outside this range the lookup returns undefined and downstream math yields
 * silently wrong dates, so callers must be rejected rather than guessed at.
 */
const LUNAR_YEAR_MIN = 1900;
const LUNAR_YEAR_MAX = 2100;

const assertYearInRange = (year) => {
  if (!Number.isInteger(year) || year < LUNAR_YEAR_MIN || year > LUNAR_YEAR_MAX) {
    throw new RangeError(`Year ${year} out of supported range ${LUNAR_YEAR_MIN}-${LUNAR_YEAR_MAX}`);
  }
};

const assertSolarMonthDay = (month, day) => {
  if (!Number.isInteger(month) || month < 1 || month > 12) {
    throw new RangeError(`Month ${month} out of range 1-12`);
  }
  if (!Number.isInteger(day) || day < 1 || day > 31) {
    throw new RangeError(`Day ${day} out of range 1-31`);
  }
};

const assertLunarMonthDay = (month, day) => {
  if (!Number.isInteger(month) || month < 1 || month > 12) {
    throw new RangeError(`Lunar month ${month} out of range 1-12`);
  }
  if (!Number.isInteger(day) || day < 1 || day > 30) {
    throw new RangeError(`Lunar day ${day} out of range 1-30`);
  }
};

/**
 * Get lunar year information from lookup table
 */
const getLunarYearInfo = (year) => {
  assertYearInRange(year);
  return LUNAR_INFO[year - 1900];
};

/**
 * Calculate total days in a lunar year
 *
 * The calculation:
 * 1. Start with base of 348 days (12 months × 29 days)
 * 2. Add 1 day for each "big month" (30 days) by checking bits
 * 3. Add days from leap month if present
 *
 * @param {number} year - Lunar year (1900-2049)
 * @returns {number} Total days in the lunar year (353-385)
 */
const calculateLunarYearDays = (year) => {
  const yearInfo = getLunarYearInfo(year);
  let totalDays = 348; // Base: 12 months × 29 days

  // Check each bit (0x8000 to 0x10) to determine 30-day months
  // Bit set to 1 = 30 days (big month), 0 = 29 days (small month)
  for (let i = 0x8000; i > 0x8; i >>= 1) {
    totalDays += yearInfo & i ? 1 : 0;
  }

  return totalDays + calculateLeapMonthDays(year);
};

/**
 * Get which month is the leap month (0 if none)
 */
const getLeapMonth = (year) => getLunarYearInfo(year) & 0xf;

/**
 * Calculate days in leap month (0 if no leap month)
 */
const calculateLeapMonthDays = (year) => {
  const leapMonth = getLeapMonth(year);
  if (leapMonth === 0) return 0;

  const yearInfo = getLunarYearInfo(year);
  return yearInfo & 0x10000 ? 30 : 29;
};

/**
 * Calculate days in a specific lunar month
 */
const calculateMonthDays = (year, month) => {
  const yearInfo = getLunarYearInfo(year);
  return yearInfo & (0x10000 >> month) ? 30 : 29;
};

/**
 * Get stem-branch combination from number
 */
const getStemBranch = (num) => HEAVENLY_STEMS[num % 10] + EARTHLY_BRANCHES[num % 12];

/**
 * Get the Heavenly Stem for an hour based on the Day Stem and Hour Branch
 * Formula: HourStemIndex = (DayStemIndex % 5 * 2 + HourBranchIndex) % 10
 */
const getHourStem = (dayStemIdx, hourBranchIdx) => {
  return HEAVENLY_STEMS[((dayStemIdx % 5) * 2 + hourBranchIdx) % 10];
};

/**
 * Format lunar day into Chinese characters
 */
const formatLunarDay = (day) => {
  switch (day) {
    case 10:
      return '初十';
    case 20:
      return '二十';
    case 30:
      return '三十';
    default:
      return DAY_PREFIXES[Math.floor(day / 10)] + DAY_NAMES[day % 10];
  }
};

/**
 * Map lunar day to moon phase
 * @param {number} lunarDay - Day of the lunar month (1–30)
 * @returns {{ name: string, nameZh: string }}
 */
const getMoonPhase = (lunarDay) => {
  if (lunarDay === 1) return { name: 'New Moon', nameZh: '朔' };
  if (lunarDay >= 2 && lunarDay <= 6) return { name: 'Waxing Crescent', nameZh: '娥眉月' };
  if (lunarDay >= 7 && lunarDay <= 8) return { name: 'First Quarter', nameZh: '上弦月' };
  if (lunarDay >= 9 && lunarDay <= 14) return { name: 'Waxing Gibbous', nameZh: '盈凸月' };
  if (lunarDay === 15) return { name: 'Full Moon', nameZh: '望' };
  if (lunarDay >= 16 && lunarDay <= 22) return { name: 'Waning Gibbous', nameZh: '亏凸月' };
  if (lunarDay === 23) return { name: 'Last Quarter', nameZh: '下弦月' };
  return { name: 'Waning Crescent', nameZh: '残月' };
};

/**
 * Extract wall-clock date components from a Date.
 * When utcOffset (hours) is provided, interprets the timestamp at that fixed offset
 * rather than the runtime's local timezone.
 */
const getComponents = (date, utcOffset) => {
  if (utcOffset === undefined || utcOffset === null) {
    return {
      year: date.getFullYear(),
      month: date.getMonth(),
      day: date.getDate(),
      hour: date.getHours(),
      minute: date.getMinutes(),
      second: date.getSeconds()
    };
  }
  const shifted = new Date(date.getTime() + utcOffset * 3600000);
  return {
    year: shifted.getUTCFullYear(),
    month: shifted.getUTCMonth(),
    day: shifted.getUTCDate(),
    hour: shifted.getUTCHours(),
    minute: shifted.getUTCMinutes(),
    second: shifted.getUTCSeconds()
  };
};

// ===== TIME PERIOD FUNCTIONS =====

const getTimePeriodForHour = (hour) => {
  if (hour >= 23 || hour < 1) {
    return {
      name: '子时',
      zodiac: '鼠',
      period: '23:00-01:00',
      branch: '子',
      description: TIME_DESCRIPTIONS['子时']
    };
  }

  const timePeriod = TIME_PERIODS.find((period) => hour >= period.startHour && hour < period.endHour);

  if (!timePeriod) {
    return {
      name: '未知',
      zodiac: '未知',
      period: '未知',
      branch: '未知',
      description: '时间段未知'
    };
  }

  return {
    name: timePeriod.name,
    zodiac: timePeriod.zodiac,
    period: `${String(timePeriod.startHour).padStart(2, '0')}:00-${String(timePeriod.endHour).padStart(2, '0')}:00`,
    branch: timePeriod.branch,
    description: TIME_DESCRIPTIONS[timePeriod.name] || '时间段描述未知'
  };
};

/**
 * Get time period information for a given time
 */
const getTimePeriod = (date) => {
  if (!isValidDate(date)) {
    throw new Error('Invalid date provided');
  }
  return getTimePeriodForHour(date.getHours());
};

// ===== CORE CONVERSION FUNCTIONS =====

/**
 * Convert solar (Gregorian) date to lunar date information
 *
 * Algorithm:
 * 1. Calculate days from base date (Jan 31, 1900)
 * 2. Subtract year by year to find lunar year
 * 3. Subtract month by month (handling leap months) to find lunar month
 * 4. Remaining days = lunar day
 *
 * @param {Date} solarDate - Gregorian date to convert
 * @returns {Object} Lunar date info: { year, month, day, isLeap }
 */
const calculateLunarFromSolar = (solarDate) => {
  // Calculate total days from base date (1900/1/31)
  const dayOffset = Math.round((solarDate.valueOf() - BASE_DATE.valueOf()) / MILLISECONDS_PER_DAY);
  let remainingDays = dayOffset;
  let year = 1900;

  // Find the lunar year by subtracting year lengths
  while (year < 2101 && remainingDays > 0) {
    const yearDays = calculateLunarYearDays(year);
    if (remainingDays < yearDays) break;
    remainingDays -= yearDays;
    year++;
  }

  if (remainingDays < 0) {
    year--;
    remainingDays += calculateLunarYearDays(year);
  }

  // Find the lunar month and day by subtracting month lengths
  const leapMonth = getLeapMonth(year);
  let month;
  let isLeapMonth = false;

  for (month = 1; month <= 12; month++) {
    // Regular month days
    const monthDays = calculateMonthDays(year, month);
    if (remainingDays < monthDays) {
      isLeapMonth = false;
      break;
    }
    remainingDays -= monthDays;

    // Leap month days (if applicable)
    if (month === leapMonth) {
      const leapDays = calculateLeapMonthDays(year);
      if (remainingDays < leapDays) {
        isLeapMonth = true;
        break;
      }
      remainingDays -= leapDays;
    }
  }

  return {
    year,
    month,
    day: remainingDays + 1,
    isLeap: isLeapMonth
  };
};

/**
 * Convert lunar date to solar (Gregorian) date information
 *
 * Algorithm (reverse of lunar to solar):
 * 1. Add up all days from 1900 to target lunar year
 * 2. Add days for complete months in target year
 * 3. Add days in target month
 * 4. Add to base date to get Gregorian date
 *
 * @param {number} lunarYear - Lunar year
 * @param {number} lunarMonth - Lunar month (1-12)
 * @param {number} lunarDay - Lunar day (1-30)
 * @param {boolean} isLeapMonth - Whether this is a leap month
 * @param {number} hour - Hour (0-23)
 * @param {number} minute - Minute (0-59)
 * @param {number} second - Second (0-59)
 * @returns {Object} Solar date info: { year, month, day, hour, minute, second }
 */
const calculateSolarFromLunar = (
  lunarYear,
  lunarMonth,
  lunarDay,
  isLeapMonth = false,
  hour = 0,
  minute = 0,
  second = 0
) => {
  let totalDays = 0;

  // Sum all days from 1900 to target year (exclusive)
  for (let year = 1900; year < lunarYear; year++) {
    totalDays += calculateLunarYearDays(year);
  }

  // Add days for complete months in the current year
  for (let month = 1; month < lunarMonth; month++) {
    if (month === getLeapMonth(lunarYear)) {
      totalDays += calculateLeapMonthDays(lunarYear);
    }
    totalDays += calculateMonthDays(lunarYear, month);
  }

  // If current month is leap month, add normal month days
  if (isLeapMonth && getLeapMonth(lunarYear) === lunarMonth) {
    totalDays += calculateMonthDays(lunarYear, lunarMonth);
  }

  // Add days in current month
  totalDays += lunarDay - 1;

  const solarDate = new Date(BASE_DATE.valueOf() + totalDays * MILLISECONDS_PER_DAY);

  return {
    year: solarDate.getFullYear(),
    month: solarDate.getMonth(),
    day: solarDate.getDate(),
    hour,
    minute,
    second
  };
};

/**
 * Solar term dates from the sun's position.
 *
 * A solar term is the moment the sun's apparent ecliptic longitude crosses a multiple of 15 degrees
 * (小寒 285, 大寒 300, 立春 315 ... 冬至 270). The longitude comes from the low-accuracy series in
 * Meeus, Astronomical Algorithms ch. 25 (about 0.01 degrees, so a few minutes of time), and a bisection
 * finds each crossing. The date is the Beijing (UTC+8) calendar date of that instant, the same
 * convention as the Hong Kong Observatory tables.
 *
 * A term within about 12 minutes of midnight can land on the wrong side. The 16 such cases in
 * 1901-2100 (checked against the Observatory tables, see the golden test) are corrected in SOLAR_TERM_FIXES.
 */
const RADIANS = Math.PI / 180;
const BEIJING_OFFSET_MS = 8 * 3600000;

// day-of-month corrections where the instant falls within minutes of midnight: { year: { termIndex: day } }
const SOLAR_TERM_FIXES = {
  1912: { 18: 9, 21: 23 },
  1913: { 17: 24 },
  1923: { 3: 19 },
  1927: { 16: 8 },
  1928: { 11: 21 },
  1950: { 7: 20 },
  1951: { 23: 23 },
  1979: { 1: 21 },
  2014: { 4: 6 },
  2016: { 12: 7 },
  2045: { 12: 7 },
  2047: { 4: 6 },
  2051: { 5: 20 },
  2082: { 1: 20 },
  2097: { 8: 5 }
};

const wrapDegrees = (d) => ((d % 360) + 360) % 360;

/** Apparent ecliptic longitude of the sun in degrees at a Unix time in ms (UT used as TT, a sub-minute effect). */
const sunApparentLongitude = (ms) => {
  const T = (ms / MILLISECONDS_PER_DAY + 2440587.5 - 2451545) / 36525;
  const meanLongitude = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = (357.52911 + 35999.05029 * T - 0.0001537 * T * T) * RADIANS;
  const centre =
    (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(M) +
    (0.019993 - 0.000101 * T) * Math.sin(2 * M) +
    0.000289 * Math.sin(3 * M);
  const omega = (125.04 - 1934.136 * T) * RADIANS;
  return wrapDegrees(meanLongitude + centre - 0.00569 - 0.00478 * Math.sin(omega));
};

const solarTermDayCache = new Map();

/**
 * Calculate the date (day of month, Beijing time) for a specific solar term
 *
 * @param {number} year - Gregorian year
 * @param {number} termIndex - Index of solar term (0-23, 小寒 first)
 * @returns {number} Day of the month
 */
const getSolarTermDay = (year, termIndex) => {
  const fix = SOLAR_TERM_FIXES[year]?.[termIndex];
  if (fix) return fix;
  const key = year * 100 + termIndex;
  if (solarTermDayCache.has(key)) return solarTermDayCache.get(key);
  const target = wrapDegrees(285 + 15 * termIndex);
  // the crossing lies within 6 days of 5 January plus 15.2184 days per term; bisect the signed angle to the target
  let lo = Date.UTC(year, 0, 5) + (termIndex * 15.2184 - 6) * MILLISECONDS_PER_DAY;
  let hi = lo + 12 * MILLISECONDS_PER_DAY;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    const angle = ((sunApparentLongitude(mid) - target + 540) % 360) - 180;
    if (angle < 0) lo = mid;
    else hi = mid;
  }
  const day = new Date((lo + hi) / 2 + BEIJING_OFFSET_MS).getUTCDate();
  solarTermDayCache.set(key, day);
  return day;
};

/**
 * Get all 24 solar terms for a given Gregorian year
 *
 * @param {number} year - Gregorian year
 * @returns {Array<{nameZh: string, month: number, day: number}>}
 */
const getSolarTermsForYear = (year) =>
  SOLAR_TERM_NAMES.map((nameZh, i) => ({
    nameZh,
    month: Math.floor(i / 2) + 1,
    day: getSolarTermDay(year, i)
  }));

/**
 * Calculate stem-branch (干支) information for a date
 *
 * The stem-branch system is a 60-year/60-day cycle combining:
 * - 10 Heavenly Stems (天干)
 * - 12 Earthly Branches (地支)
 * Used for years, months, days, and hours in traditional Chinese calendar
 *
 * @param {number} year - Gregorian year
 * @param {number} month - Gregorian month (0-11)
 * @param {number} day - Gregorian day
 * @returns {Object} Stem-branch for year, month, and day
 */
// positive modulo: JS `%` keeps the sign of the dividend, so dates before the anchor gave a negative index and an empty pillar
const wrapIndex = (n, size) => ((n % size) + size) % size;

const calculateStemBranch = (year, month, day) => {
  // Year pillar changes at Li Chun (Start of Spring, term index 2), not Jan 1
  let yearForStem = year;
  const liChunDay = getSolarTermDay(year, 2);
  if (month === 0 || (month === 1 && day < liChunDay)) {
    yearForStem--;
  }
  const yearIdx = wrapIndex(yearForStem - 1900 + 36, 60);

  // Month pillar is defined by the 12 Jie sectional terms (even indices: 0, 2, 4, ...)
  // Each Jie falls in the same Gregorian month; if before the term, use the prior solar month.
  const termIndex = month * 2;
  const termDay = getSolarTermDay(year, termIndex);

  // Offset 13 places 1900-Jan (post-XiaoHan) at the correct cycle position (Wu-Yin = 14th)
  let totalMonths = (year - 1900) * 12 + month + 13;
  if (day < termDay) {
    totalMonths--;
  }
  const monthIdx = wrapIndex(totalMonths, 60);

  // Day stem-branch
  // +17 anchors the sexagenary day cycle: 2000-01-01 = 戊午 (index 54), 2000-01-07 = 甲子 (index 0),
  // matching the Hong Kong Observatory almanac. (the earlier +33 / 甲戌 anchor was off by 16.)
  const dayOffset = Math.floor(Date.UTC(year, month, day) / MILLISECONDS_PER_DAY) + 17;
  const dayIdx = wrapIndex(dayOffset, 60);

  return {
    year: {
      stem: HEAVENLY_STEMS[yearIdx % 10],
      branch: EARTHLY_BRANCHES[yearIdx % 12],
      name: getStemBranch(yearIdx),
      index: yearIdx
    },
    month: {
      stem: HEAVENLY_STEMS[monthIdx % 10],
      branch: EARTHLY_BRANCHES[monthIdx % 12],
      name: getStemBranch(monthIdx),
      index: monthIdx
    },
    day: {
      stem: HEAVENLY_STEMS[dayIdx % 10],
      branch: EARTHLY_BRANCHES[dayIdx % 12],
      name: getStemBranch(dayIdx),
      index: dayIdx
    }
  };
};

/**
 * Get solar (Gregorian) festival for a given date
 * @param {number} month - Month (1-12)
 * @param {number} day - Day (1-31)
 * @returns {Object|null} Festival info or null
 */
const getSolarFestival = (month, day) => {
  const key = String(month).padStart(2, '0') + String(day).padStart(2, '0');
  return SOLAR_FESTIVALS[key] || null;
};

/**
 * Get lunar festival for a given lunar date
 * @param {number} month - Lunar month (1-12)
 * @param {number} day - Lunar day (1-30)
 * @param {number} year - Lunar year (for New Year's Eve calculation)
 * @returns {Object|null} Festival info or null
 */
const getLunarFestival = (month, day, year) => {
  const key = String(month).padStart(2, '0') + String(day).padStart(2, '0');

  // Check for New Year's Eve (last day of 12th month)
  if (month === 12) {
    const lastDay = calculateMonthDays(year, 12);
    if (day === lastDay) {
      return LUNAR_FESTIVALS['0100']; // 除夕
    }
  }

  return LUNAR_FESTIVALS[key] || null;
};

/**
 * Check if a lunar day is a 三娘煞日 (Sanniang Sha Day)
 * These are inauspicious days for weddings: 3, 7, 13, 18, 22, 27
 * @param {number} day - Lunar day
 * @returns {boolean} True if it's a Sanniang Sha day
 */
const isSanniangShaDay = (day) => SANNIANG_SHA_DAYS.includes(day);

// ===== MAIN API FUNCTIONS =====

/**
 * Convert Gregorian (solar) date to comprehensive lunar calendar information
 *
 * Main API function that returns complete lunar calendar data including:
 * - Solar date info (year, month, day, time)
 * - Lunar date info (year, month, day, zodiac)
 * - Stem-branch (干支) for year, month, day, hour
 * - Time period (时辰) information
 * - Festivals (solar and lunar)
 *
 * Supports two input formats:
 * 1. solarToLunar(dateObject)
 * 2. solarToLunar(year, month, day, hour, minute, second)
 *
 * @param {Date|number} solarDate - Gregorian date object OR year
 * @param {number} [month] - Gregorian month (1-12)
 * @param {number} [day] - Gregorian day (1-31)
 * @param {number} [hour=0] - Hour (0-23)
 * @param {number} [minute=0] - Minute (0-59)
 * @param {number} [second=0] - Second (0-59)
 * @returns {Object} Comprehensive lunar calendar information
 * @throws {Error} If invalid date provided
 */
const solarToLunar = (solarDate, month, day, hour = 0, minute = 0, second = 0, options = {}) => {
  let date;
  if (solarDate instanceof Date) {
    date = solarDate;
    if (typeof month === 'object' && month !== null) {
      options = month; // solarToLunar(date, { traditions: [...] })
    }
  } else if (typeof solarDate === 'number' && month !== undefined && day !== undefined) {
    assertYearInRange(solarDate);
    assertSolarMonthDay(month, day);
    date = new Date(solarDate, month - 1, day, hour, minute, second);
  } else {
    throw new Error('Invalid date provided');
  }

  if (!isValidDate(date)) {
    throw new Error('Invalid date provided');
  }

  // Extract wall-clock components, respecting utcOffset when provided
  const isDateForm = solarDate instanceof Date;
  const comp = isDateForm ? getComponents(date, options.utcOffset) : getComponents(date, undefined);

  // Adjust if 23:00 (子时 belongs to the next day in the lunar calendar)

/**

 *
 * Main API function (reverse of solarToLunar) that returns complete data.
 *
 * Supports two input formats:
 * 1. lunarToSolar(dateObject, [isLeapMonth=false], [hour=0], [min=0], [sec=0])
 * 2. lunarToSolar(year, month, day, [isLeapMonth=false], [hour=0], [min=0], [sec=0])
 *
 * @param {Date|number} lunarYearOrDate - Lunar date object OR lunar year
 * @param {number|boolean} lunarMonthOrLeap - Lunar month (1-12) OR isLeapMonth if format 1
 * @param {number} [lunarDay] - Lunar day (1-30)
 * @param {boolean} [isLeapMonth=false] - Whether this is a leap month
 * @param {number} [hour=0] - Hour (0-23)
 * @param {number} [minute=0] - Minute (0-59)
 * @param {number} [second=0] - Second (0-59)

 */

  lunarYearOrDate,
  lunarMonthOrLeap,
  lunarDayVal,
  isLeapMonthVal = false,
  hourVal = 0,
  minuteVal = 0,
  secondVal = 0,
  options = {}

    lunarMonth,
    lunarDay,
    isLeapMonth = false,
    hour = 0,
    minute = 0,
    second = 0;

    if (typeof lunarDayVal === 'object' && lunarDayVal !== null) {
      options = lunarDayVal; // lunarToSolar(date, isLeapMonth, { traditions: [...] })
    }
    const comp = getComponents(lunarYearOrDate, options.utcOffset);
    lunarYear = comp.year;
    lunarMonth = comp.month + 1;
    lunarDay = comp.day;
    isLeapMonth = !!lunarMonthOrLeap;
    hour = hourVal;
    minute = minuteVal;
    second = secondVal;
  } else if (typeof lunarYearOrDate === 'number' && lunarMonthOrLeap !== undefined && lunarDayVal !== undefined) {
    lunarYear = lunarYearOrDate;
    lunarMonth = lunarMonthOrLeap;
    lunarDay = lunarDayVal;
    isLeapMonth = isLeapMonthVal;
    hour = hourVal;
    minute = minuteVal;
    second = secondVal;
  } else {
    throw new Error(
      'Invalid input. Use (lunarDate, isLeapMonth) or (year, month, day, isLeapMonth, hour, minute, second)'
    );
  }

  assertYearInRange(lunarYear);
  assertLunarMonthDay(lunarMonth, lunarDay);

  if (isLeapMonth) {
    const leapMonthForYear = getLeapMonth(lunarYear);

  }

  const solarInfo = calculateSolarFromLunar(lunarYear, lunarMonth, lunarDay, isLeapMonth, hour, minute, second);
  const solarDate = new Date(solarInfo.year, solarInfo.month, solarInfo.day);
  const stemBranchInfo = calculateStemBranch(solarInfo.year, solarInfo.month, solarInfo.day);

  const traditionsFilter = options.traditions && options.traditions.length > 0 ? options.traditions : null;
  const solarFestival = filterFestival(getSolarFestival(solarInfo.month + 1, solarInfo.day), traditionsFilter);
  const lunarFestival = filterFestival(getLunarFestival(lunarMonth, lunarDay, lunarYear), traditionsFilter);

  const matchedTermLunar = getSolarTermsForYear(solarInfo.year).find(
    (t) => t.month === solarInfo.month + 1 && t.day === solarInfo.day
  );

      month: solarInfo.month + 1,
      day: solarInfo.day,
      weekDay: DAY_NAMES[solarDate.getDay()],
      time: {

      year: lunarYear,
      month: lunarMonth,
      day: lunarDay,

      monthName: MONTH_NAMES[lunarMonth - 1],
      dayName: formatLunarDay(lunarDay),
      zodiac: ZODIAC_ANIMALS[(lunarYear - 1900) % 12]
    },
    stemBranch: {
      year: stemBranchInfo.year.name,
      month: stemBranchInfo.month.name,
      day: stemBranchInfo.day.name,
      time: hourTimePeriod ? hourTimePeriod.branch : null
    },
    baZi: {
      year: { stem: stemBranchInfo.year.stem, branch: stemBranchInfo.year.branch },
      month: { stem: stemBranchInfo.month.stem, branch: stemBranchInfo.month.branch },
      day: { stem: stemBranchInfo.day.stem, branch: stemBranchInfo.day.branch },

function localComponents(date      , utcOffset         )                 {
  if (utcOffset === undefined) {
    return { year: date.getFullYear(), month: date.getMonth() + 1, day: date.getDate(), hour: date.getHours() };
  }
  const shifted = new Date(date.getTime() + utcOffset * 3_600_000);
  return { year: shifted.getUTCFullYear(), month: shifted.getUTCMonth() + 1, day: shifted.getUTCDate(), hour: shifted.getUTCHours() };
}



const HEAVENLY_STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸']         ;

// day pillar derivation is owned by soluna; it handles the 子时 (23:00) day rollover,
// which a plain calendar-date calculation misses. all interpretation modules read from here.
function getDayPillar(date      , utcOffset         )         {
  return solarToLunar(date, { utcOffset }).baZi.day;
}

function getHourBranchIndex(hour        )         {
  return Math.floor((hour + 1) / 2) % 12;
}

function getHourPillar(date      , dayStemIndex        , utcOffset         )         {
  const { hour } = localComponents(date, utcOffset);
  const hourBranchIndex = getHourBranchIndex(hour);
  const startStem = (dayStemIndex % 5) * 2;
  const stemIndex = (startStem + hourBranchIndex) % 10;
  return { stem: HEAVENLY_STEMS[stemIndex], branch: EARTHLY_BRANCHES[hourBranchIndex] };
}

function getHourBranchName(hour        )         {
  return HOUR_BRANCH_NAMES[getHourBranchIndex(hour)];
}

function getDayStemIndex(date      , utcOffset         )         {
  const stem = getDayPillar(date, utcOffset).stem;
  return HEAVENLY_STEMS.indexOf(stem                                 );
}


function getFourPillars(date      , utcOffset         )              {
  const result = solarToLunar(date, { utcOffset });
  return {
    year: result.baZi.year,

// Returns the month's earthly branch index (0-11) derived from solar terms (节气).
// Month starts at each 节 term (even indices in the solar term list).
function getMonthBranchIndex(date      , utcOffset         )         {
  const { year, month, day } = localComponents(date, utcOffset);
  const terms = getSolarTermsForYear(year);

  // 节 terms are at even indices; slot 0..11 map to branch (slot+1)%12
  for (let slot = 11; slot >= 0; slot--) {
    const t = terms[slot * 2];
    if (month > t.month || (month === t.month && day >= t.day)) {
      return (slot + 1) % 12;
    }
  }

  // Before 小寒 this year - still in 子月 from prev year's 大雪
  return 0;
}

function getMonthBranch(date      , utcOffset         )         {
  return EARTHLY_BRANCHES[getMonthBranchIndex(date, utcOffset)];
}

function getDailyOfficer(date      , utcOffset         )               {
  const dayBranch = getDayPillar(date, utcOffset).branch;
  const dayBranchIndex = EARTHLY_BRANCHES.indexOf(dayBranch                                   );
  const monthBranchIndex = getMonthBranchIndex(date, utcOffset);
  const index = (dayBranchIndex - monthBranchIndex + 12) % 12;
  return { index, name: OFFICERS[index][0], english: OFFICERS[index][1] };
}

      rating,
      tags,

function getMoonPhase(date      , utcOffset         )            {

  const lunarDay = result.lunar.day;

  let phase        ;
  let phaseCN        ;

  if (lunarDay === 1) {
    phase = 'new moon'; phaseCN = '朔';
  } else if (lunarDay <= 6) {
    phase = 'waxing crescent'; phaseCN = '娥眉月';
  } else if (lunarDay <= 8) {
    phase = 'first quarter'; phaseCN = '上弦月';
  } else if (lunarDay <= 14) {

  } else if (lunarDay <= 16) {

  } else if (lunarDay <= 22) {

  } else if (lunarDay <= 23) {
    phase = 'last quarter'; phaseCN = '下弦月';
  } else {
    phase = 'waning crescent'; phaseCN = '残月';
  }

  return { phase, phaseCN, lunarDay };

function getNaYin(pillar        )        {
  const stem = HEAVENLY_STEMS.indexOf(pillar.stem                                 );
  const branch = EARTHLY_BRANCHES.indexOf(pillar.branch                                   );

  if (stem < 0 || branch < 0 || stem % 2 !== branch % 2) {
    return { element: 'unknown', elementCN: '未知' };
  }

  const k = (((Math.floor((branch - stem) / 2) % 6) + 6) % 6 * 5) % 6;
  const pos = stem + 10 * k;
  const naYinIndex = Math.floor(pos / 2);
  const [element, elementCN] = NA_YIN[naYinIndex];
  return { element, elementCN };

// relation key -> [badge char, english label]; the order is the tint priority
const REL = { self: ['值日', 'today'], clash: ['冲', 'clash'], harmony: ['合', 'harmony'], harm: ['害', 'harm'], punish: ['刑', 'punishment'], break: ['破', 'break'] };

const BREAKS = ['子酉', '丑辰', '寅亥', '卯午', '巳申', '未戌'];            // 六破 pairs
const PUNISH_GROUPS = [['寅', '巳', '申'], ['丑', '戌', '未'], ['子', '卯']]; // 三刑 triads and the 子卯 pair
const SELF_PUNISH = '辰午酉亥';                                              // 自刑: these punish themselves

// branches the day branch punishes (the rest of its group)
const punishedBy = (day) => PUNISH_GROUPS.filter((g) => g.includes(day)).flatMap((g) => g.filter((x) => x !== day));
// the branch the day branch breaks
const brokenBy = (day) => BREAKS.filter((p) => p.includes(day)).map((p) => p.replace(day, ''));

// every relation each of the 12 branches has to the day branch, in REL priority order.
// relations: the app's per-branch values ('self'|'clash'|'harmony'|'neutral'); harmBranch: the app's day harm branch
function mergeRelations(day, relations, harmBranch) {
  const punished = punishedBy(day);
  const broken = brokenBy(day);
  return BRANCHES.map((b, i) => {
    const r = [];
    if (['self', 'clash', 'harmony'].includes(relations[i])) r.push(relations[i]);
    if (b === harmBranch) r.push('harm');
    if (punished.includes(b) || (b === day && SELF_PUNISH.includes(day))) r.push('punish');
    if (broken.includes(b)) r.push('break');
    return r;
  });
}

// the stars present on a day: the month branch index, the day pillar [stem, branch] and the day's 建除 officer name
function starsOf(monthBranchIdx, [stem, branch], officerName, yearBranchIdx) {
  const m = monthNumber(monthBranchIdx);
  const d = BRANCH_CHARS.indexOf(branch);
  const found = Object.entries(BRANCH_STAR).filter(([, at]) => at(m) === d).map(([name]) => name);
  if (TIANYUAN[m - 1] === stem + branch) found.push('天願');
  if (d !== monthBranchIdx && d % 4 === monthBranchIdx % 4) found.push('三合'); // the other two of the month's triad
  if (STAR_SIX_HARMONY[monthBranchIdx] === d) found.push('六合');
  if (d === wrap(monthBranchIdx + 6, 12)) found.push('月破'); // the day clashes the month
  if (STAR_PUNISH[monthBranchIdx] === d) found.push('月刑');
  if (SIFEI[Math.floor((m - 1) / 3)].includes(stem + branch)) found.push('四廢');
  if (officerName === '平') found.push('平日');
  if (officerName === '收') found.push('收日');
  if (stem === '辛') found.push('辛日');
  const season = Math.floor((m - 1) / 3);
  const pillar = stem + branch;
  if (MINRI[season] === branch) found.push('民日');
  if (SIHAO[season] === pillar) found.push('四耗');
  if (SIJI[season] === pillar) found.push('四忌');
  if (SIQIONG[season] === pillar) found.push('四窮');
  if (WUMU.some(([ms, p]) => ms.includes(m) && p === pillar)) found.push('五墓');
  if (branch === '寅' || branch === '卯') found.push('五合');
  if (d === monthBranchIdx) found.push('月建', '土府'); // 土府 is 月建 under another name (卷四)
  if (d === wrap(monthBranchIdx + 1, 12)) found.push('吉期'); // 月建前一辰: forward by one, as the book counts 前
  if (DINANG[m - 1].includes(pillar)) found.push('地囊');
  if (TIANXI[season] === branch) found.push('天喜');
  if (WANGRI[season] === branch) found.push('王日');
  if (branch === '巳') found.push('巳日');
  if (branch === '亥') found.push('亥日');
  if (BUJIANG[m - 1].includes(pillar)) found.push('不將');
  if (BAZHUAN.includes(pillar)) found.push('八專');
  if (branch === '申' || branch === '酉') found.push('五離');
  if (OFFICER_DAYS[officerName]) found.push(OFFICER_DAYS[officerName]);
  if (yearBranchIdx !== undefined && d === wrap(yearBranchIdx + 6, 12)) found.push('大耗'); // 常居歲衝之地
  if (TIANSHE[season] === stem + branch) found.push('天赦');
  if (YUEEN[m - 1] === stem) found.push('月恩');
  if (SIXIANG[season].includes(stem)) found.push('四相');
  if (SHIDE[season] === branch) found.push('時德');
  // 德 stars: the day stem (or branch, for a direction-style 天德) matches the month's position
  DE_STARS[m - 1].forEach((at, i) => { if (at && (at === stem || at === branch)) found.push(DE_NAMES[i]); });
  return found;
}

// simple rules (decided 2026-10-10, the book's six-grade weighing is not encoded):
// 1. a hard 忌 (月破) is always avoid. 2. a 德 or 願 day cancels the soft 忌 stars (鋪註條例: 德合 赦 願 月恩 四相 時德 days are not marked 忌 for 醞釀).
// 3. otherwise any 忌 is avoid, else any 宜 is suitable, else neutral. 4. a day with a star whose special cases are not encoded is unsure.
const HARD = ['月破'];
const CANCEL = ['天願', '天赦', '月恩', '四相', '時德', '天德', '月德', '天德合', '月德合'];
const UNSURE = ['月厭']; // 月厭 has long special-pillar lists not encoded yet
function evaluate(activity, stars) {
  const yi = activity.yi.filter((s) => stars.includes(s));
  const ji = activity.ji.filter((s) => stars.includes(s));
  const cancelled = !!activity.cancels && CANCEL.some((c) => stars.includes(c)); // 卷十 line 492 names only 醞釀 開市 立劵 and a few others
  const live = ji.filter((s) => HARD.includes(s) || !cancelled);
  const unsure = ji.some((s) => UNSURE.includes(s)) && !live.some((s) => HARD.includes(s));
  const verdict = live.some((s) => HARD.includes(s)) ? 'avoid' : unsure ? 'unsure' : live.length ? 'avoid' : yi.length ? 'suitable' : 'neutral';
  return { yi, ji, verdict };
}

// bazi reading helpers: ten gods (十神), hidden stems (藏干), element counts and a simple day master strength rule.
// plain js, pure functions, standard textbook tables. no dependency on the app's code.
const TG_STEMS = [...'甲乙丙丁戊己庚辛壬癸'];
const TG_ELEMENTS = [...'木火土金水'];
// 藏干: hidden stems per branch, main (本氣) first
const TG_HIDDEN = { 子: '癸', 丑: '己癸辛', 寅: '甲丙戊', 卯: '乙', 辰: '戊乙癸', 巳: '丙庚戊', 午: '丁己', 未: '己丁乙', 申: '庚壬戊', 酉: '辛', 戌: '戊辛丁', 亥: '壬甲' };
const hiddenStems = (branch) => [...TG_HIDDEN[branch]];
// element index 0..4 in the producing cycle (wood, fire, earth, metal, water) and polarity (0 yang, 1 yin)
const tgElementIdx = (s) => Math.floor(TG_STEMS.indexOf(s) / 2);
const stemElement = (s) => TG_ELEMENTS[tgElementIdx(s)];
const tgPolarity = (s) => TG_STEMS.indexOf(s) % 2;
// ten god of stem s against the day master dm: element distance in the cycle, then same or different polarity
const TG_NAMES = [['比肩', '劫財'], ['食神', '傷官'], ['偏財', '正財'], ['七殺', '正官'], ['偏印', '正印']];
const tenGod = (dm, s) => TG_NAMES[(tgElementIdx(s) - tgElementIdx(dm) + 5) % 5][tgPolarity(s) === tgPolarity(dm) ? 0 : 1];
// element counts over the 4 stems and the 4 branches' main element
const elementCounts = (pillars) => {
  const c = Object.fromEntries(TG_ELEMENTS.map((e) => [e, 0]));
  for (const [s, b] of pillars) { c[stemElement(s)]++; c[stemElement(TG_HIDDEN[b][0])]++; }
  return c;
};
// simple rule: the 6 other characters weigh 1 each, the month branch 2 (月令 is the strongest influence), 8 in all.
// support = same element or the element that produces the day master; more than half = strong, less = weak.
// pillars: [year, month, day, hour] as [stem, branch]; the day stem itself is not counted
const dayMasterStrength = (pillars) => {
  const dm = pillars[2][0], d = tgElementIdx(dm);
  const supports = (s) => [0, 4].includes((tgElementIdx(s) - d + 5) % 5); // same element, or the one before it in the cycle
  const chars = [[pillars[0][0], 1], [pillars[0][1], 1], [pillars[1][0], 1], [pillars[1][1], 2], [pillars[2][1], 1], [pillars[3][0], 1], [pillars[3][1], 1]];
  // a branch counts through its main hidden stem
  const score = chars.reduce((n, [c, w]) => n + (supports(TG_STEMS.includes(c) ? c : TG_HIDDEN[c][0]) ? w : 0), 0);
  return { score, total: 8, level: score > 4 ? 'strong' : score < 4 ? 'weak' : 'balanced' };
};

// ecliptic longitudes (tropical, of date) for the sun, moon and planets. plain js, pure functions. accuracy is for choosing signs:
// planets from the JPL approximate Keplerian elements (Standish, 1800-2050, arcminutes), moon from Meeus ch.47 (main terms, about 0.05 degree).
const rad = (d) => (d * Math.PI) / 180;
const norm = (d) => ((d % 360) + 360) % 360;
const sinD = (d) => Math.sin(rad(d));
const julianT = (date) => (date.getTime() / 86400000 + 2440587.5 - 2451545) / 36525; // centuries since J2000

// apparent longitude of the sun (Meeus ch.25)
const sunLongitude = (date) => {
  const T = julianT(date);
  const L0 = 280.46646 + 36000.76983 * T, M = 357.52911 + 35999.05029 * T;
  const C = (1.914602 - 0.004817 * T) * sinD(M) + 0.019993 * sinD(2 * M) + 0.000289 * sinD(3 * M);
  return norm(L0 + C - 0.00569 - 0.00478 * sinD(125.04 - 1934.136 * T));
};

// element sets: [value at J2000, change per century] for a, e, I, L, long. of perihelion, long. of node
const ELEMENTS = {
  水星: [[0.38709927, 0.00000037], [0.20563593, 0.00001906], [7.00497902, -0.00594749], [252.2503235, 149472.67411175], [77.45779628, 0.16047689], [48.33076593, -0.12534081]],
  金星: [[0.72333566, 0.0000039], [0.00677672, -0.00004107], [3.39467605, -0.0007889], [181.9790995, 58517.81538729], [131.60246718, 0.00268329], [76.67984255, -0.27769418]],
  地球: [[1.00000261, 0.00000562], [0.01671123, -0.00004392], [-0.00001531, -0.01294668], [100.46457166, 35999.37244981], [102.93768193, 0.32327364], [0, 0]],
  火星: [[1.52371034, 0.00001847], [0.0933941, 0.00007882], [1.84969142, -0.00813131], [-4.55343205, 19140.30268499], [-23.94362959, 0.44441088], [49.55953891, -0.29257343]],
  木星: [[5.202887, -0.00011607], [0.04838624, -0.00013253], [1.30439695, -0.00183714], [34.39644051, 3034.74612775], [14.72847983, 0.21252668], [100.47390909, 0.20469106]],
  土星: [[9.53667594, -0.0012506], [0.05386179, -0.00050991], [2.48599187, 0.00193609], [49.95424423, 1222.49362201], [92.59887831, -0.41897216], [113.66242448, -0.28867794]],
};
// heliocentric ecliptic position (J2000 axes) from the elements: solve Kepler's equation, then rotate the orbit plane
const helio = (name, T) => {
  const [a, e, I, L, wbar, node] = ELEMENTS[name].map(([v, r]) => v + r * T);
  const w = wbar - node;
  const M = norm(L - wbar + 180) - 180;
  let E = M + (180 / Math.PI) * e * sinD(M); // first guess, then refine
  for (let i = 0; i < 8; i++) E -= (E - (180 / Math.PI) * e * sinD(E) - M) / (1 - e * Math.cos(rad(E)));
  const xp = a * (Math.cos(rad(E)) - e), yp = a * Math.sqrt(1 - e * e) * sinD(E);
  const [cw, sw, cn, sn, ci, si] = [Math.cos(rad(w)), sinD(w), Math.cos(rad(node)), sinD(node), Math.cos(rad(I)), sinD(I)];
  return [(cw * cn - sw * sn * ci) * xp + (-sw * cn - cw * sn * ci) * yp, (cw * sn + sw * cn * ci) * xp + (-sw * sn + cw * cn * ci) * yp, sw * si * xp + cw * si * yp];
};
// geocentric longitude of a planet, precessed from J2000 to the date (50.29 arcseconds a year)
const planetLongitude = (name, date) => {
  const T = julianT(date), [px, py] = helio(name, T), [ex, ey] = helio('地球', T);
  return norm((Math.atan2(py - ey, px - ex) * 180) / Math.PI + 1.3969713 * T);
};

// moon (Meeus ch.47): [D, M, M', F, coefficient in 1e-6 degree]; terms with M are scaled by the earth's orbit eccentricity E
const MOON_TERMS = [

];
const moonLongitude = (date) => {
  const T = julianT(date);
  const Lm = 218.3164477 + 481267.88123421 * T, D = 297.8501921 + 445267.1114034 * T, M = 357.5291092 + 35999.0502909 * T;
  const Mm = 134.9633964 + 477198.8675055 * T, F = 93.272095 + 483202.0175233 * T;
  const E = 1 - 0.002516 * T - 0.0000074 * T * T;
  let sum = 0;
  for (const [d, m, mm, f, c] of MOON_TERMS) sum += c * E ** Math.abs(m) * sinD(d * D + m * M + mm * Mm + f * F);
  // additive terms from Venus, Jupiter and the flattening of the earth
  sum += 3958 * sinD(119.75 + 131.849 * T) + 1962 * sinD(Lm - F) + 318 * sinD(53.09 + 479264.29 * T);
  return norm(Lm + sum / 1e6);
};

// Greenwich mean sidereal time in degrees at an instant
const siderealDegrees = (date) => {
  const T = julianT(date);
  return norm(280.46061837 + 360.98564736629 * (T * 36525) + 0.000387933 * T * T);
};
// mean obliquity of the ecliptic in degrees
const obliquity = (date) => 23.4392911 - 0.0130042 * julianT(date);

const sunSign = (date) => { const lon = sunLongitude(date), i = Math.floor(lon / 30); return { ...SIGNS[i], index: i, longitude: lon, degree: lon - i * 30 }; };

// sun, moon and the five visible planets, with sign and degree in the sign
const BODY_LON = { 太陽: sunLongitude, 月亮: moonLongitude };
const BODY_SYMBOLS = { 太陽: '\u2609', 月亮: '\u263D', 水星: '\u263F', 金星: '\u2640', 火星: '\u2642', 木星: '\u2643', 土星: '\u2644' };

const ASPECTS = [[0, '合相', '\u260C', 8], [60, '六分相', '\u26B9', 5], [90, '四分相', '\u25A1', 7], [120, '三分相', '\u25B3', 8], [180, '對分相', '\u260D', 8]];
const aspects = (list) => {
  const out = [];
  for (let i = 0; i < list.length; i++) for (let j = i + 1; j < list.length; j++) {
    const gap = Math.abs(list[i].longitude - list[j].longitude), sep = gap > 180 ? 360 - gap : gap;
    for (const [angle, kind, sym, maxOrb] of ASPECTS) {

const lkCross = (target, from, dir) => {
  const at = (t) => lkSigned(sunLongitude(new Date(t)), target);
  let a = from.getTime(), b = a;
  if (dir > 0) { while (at(b) < 0) { a = b; b += 86400000; } } else { while (at(a) >= 0) { b = a; a -= 86400000; } }

// assembles one day of the app's output for a date (YYYY-MM-DD) from bazi-logic (L) and the report-only logic (R).
// the page and the test both build a day through this function, so they cannot drift apart.
// pure apart from the clock's time zone: it reads local date parts. hour pillars are taken at 00:00, 02:00 ... 22:00 (one per branch).
function makeComputeDay(L, R) {
  const pair = (p) => [p.stem, p.branch];
  return function computeDay(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    const noon = new Date(y, m - 1, d, 12);
    const day = L.getDayPillar(noon);
    const lunar = L.getLunarDate(noon);
    const zodiac = L.getDayZodiacRelations(noon);
    const harm = L.getDayHarm(noon);
    const moon = L.getMoonPhase(noon);
    const naYin = L.getNaYin(day);
    const officer = L.getDailyOfficer(noon);
    const hourPillars = R.BRANCHES.map((_, i) => {
      const t = new Date(y, m - 1, d, i * 2);
      return pair(L.getHourPillar(t, L.getDayStemIndex(t)));
    });
    return {
      date: iso,
      lunarParts: { month: lunar.month, day: lunar.day, leap: !!lunar.isLeapMonth }, // numbers for the page to word in any language
      lunar: `${lunar.isLeapMonth ? '闰' : ''}${R.LUNAR_MONTHS[lunar.month - 1]}月 · ${R.LUNAR_DAYS[lunar.day - 1]}`,
      term: L.getSolarTerm(noon),
      pillars: { year: pair(L.getYearPillar(noon)), month: pair(L.getMonthPillar(noon)), day: pair(day) },
      hourPillars,
      officer,
      stars: R.starsOf(L.getMonthBranchIndex(noon), [day.stem, day.branch], officer.name, R.BRANCHES.indexOf(L.getYearPillar(noon).branch)),
      sha: R.shaDirection(day.branch),
      mansion: R.mansion(iso),
      spirit: R.daySpirit(L.getMonthBranchIndex(noon), R.BRANCHES.indexOf(day.branch)),
      hours: L.getHourRatings(noon).map((h) => ({ bi: h.branchIndex, name: h.name, start: h.startHour, rating: h.rating, tags: h.tags })),
      festivals: L.getFestivals(noon),
      moon: { cn: moon.phaseCN, en: moon.phase },
      naYin: { cn: naYin.elementCN, en: naYin.element },
      pengZu: L.getPengZu(noon),
      dirs: L.getAuspiciousDirections(noon),
      rels: R.mergeRelations(day.branch, zodiac.map((z) => z.relation), harm.branch),
    };
  };
}

},{"id":"disclaimer","kind":"text","zh_hant":"僅供文化與思考，並非建議。這是預覽版：曆書與命盤規則取自傳統，僅作抽查，可能有誤。此處內容不構成醫療、法律、財務或其他專業建議。","zh_hans":"仅供文化与思考，并非建议。这是预览版：历书与命盘规则取自传统，仅作抽查，可能有误。此处内容不构成医疗、法律、财务或其他专业建议。","ja":"文化や内省のためのもので、助言ではありません。これはプレビュー版です。暦と命式の規則は伝統に基づき、抽出確認のみで、誤りを含む可能性があります。ここに書かれた内容は医療・法律・金融その他の専門的助言ではありません。","ko":"문화와 성찰을 위한 것이며 조언이 아닙니다. 이 페이지는 미리보기입니다. 만세력과 명식의 규칙은 전통에 따른 것이며 일부만 검증되었고 오류가 있을 수 있습니다. 여기에 있는 내용은 의료, 법률, 금융 등 전문적 조언이 아닙니다.","en":"for culture and reflection, not advice. this is a preview: the almanac and chart rules are traditional, only spot-checked, and may contain errors. nothing here is medical, legal, financial or other professional advice.","pinyin":""},{"id":"support_note","kind":"text","zh_hant":"免費使用。如果有幫助，歡迎在這裡支持：","zh_hans":"免费使用。如果有帮助，欢迎在这里支持：","ja":"無料でご利用いただけます。お役に立てたら、こちらから応援できます：","ko":"무료로 이용할 수 있습니다. 도움이 되었다면 여기에서 응원해 주세요:","en":"free to use. if it helps, you can support it here:","pinyin":""},{"id":"support_link","kind":"text","zh_hant":"請我喝杯咖啡","zh_hans":"请我喝杯咖啡","ja":"コーヒーをおごる","ko":"커피 한 잔 사주기","en":"buy me a coffee","pinyin":""},{"id":"footer","kind":"text","zh_hant":"在本頁即時計算，曆書範圍為 1900-01-31 至 2099-12-31；生成於 {stamp}；以 23:00 為日界；時柱隨所選時辰而定。","zh_hans":"在本页实时计算，历书范围为 1900-01-31 至 2099-12-31；生成于 {stamp}；以 23:00 为日界；时柱随所选时辰而定。","ja":"このページ内でリアルタイムに計算。暦の範囲は1900-01-31〜2099-12-31。生成日時 {stamp}。日付の切り替えは23:00。時柱は選択した時刻に従います。","ko":"이 페이지에서 실시간으로 계산합니다. 만세력 범위는 1900-01-31부터 2099-12-31까지. 생성 시각 {stamp}. 날짜는 23:00에 바뀝니다. 시주는 선택한 시각에 따릅니다.","en":"computed live in this page, almanac for 1900-01-31 to 2099-12-31; generated {stamp}; day rolls over at 23:00; hour pillar follows the selected hour","pinyin":""},{"id":"officer_note","kind":"text","zh_hant":"來自應用：每個建除值日一份清單。完整曆書還會加入神煞，因此清單更長，也會有所不同。","zh_hans":"来自应用：每个建除值日一份清单。完整历书还会加入神煞，因此清单更长，也会有所不同。","ja":"アプリ由来：十二直ごとに一つのリスト。完全な暦は神煞も加えるため、リストはより長く、内容も異なります。","ko":"앱 기준: 십이직마다 목록 하나. 완전한 만세력은 신살도 더하므로 목록이 더 길고 내용도 다릅니다.","en":"from the app: one list per daily officer. a full almanac also adds the stars, so its lists are longer and differ.","pinyin":""},{"id":"milder","kind":"text","zh_hant":"較輕","zh_hans":"较轻","ja":"軽め","ko":"약한 경우","en":"milder","pinyin":""},{"id":"no_day","kind":"text","zh_hant":"此範圍內沒有適宜的日子","zh_hans":"此范围内没有适宜的日子","ja":"この期間に適した日はありません","ko":"이 기간에 적합한 날이 없습니다","en":"no suitable day in this range","pinyin":""},{"id":"unsure_note","kind":"text","zh_hant":"這些日子帶有特殊情形尚未編碼的神煞：","zh_hans":"这些日子带有特殊情形尚未编码的神煞：","ja":"特殊な場合がまだ未実装の神煞を持つ日です：","ko":"특수한 경우가 아직 반영되지 않은 신살이 있는 날입니다:","en":"these days have a star whose special cases are not encoded yet:","pinyin":""},{"id":"rule_note","kind":"text","zh_hant":"依據《欽定協紀辨方書》卷十一的規則：宜 {yi}；忌 {ji}。適宜：有宜的神煞且沒有忌的神煞（德日或願日可抵消較輕的忌；月破永不抵消）。點擊某一天可在曆書中打開。","zh_hans":"依据《欽定協紀辨方書》卷十一的规则：宜 {yi}；忌 {ji}。适宜：有宜的神煞且没有忌的神煞（德日或愿日可抵消较轻的忌；月破永不抵消）。点击某一天可在历书中打开。","ja":"『欽定協紀辨方書』巻十一の規則：宜 {yi}；忌 {ji}。適した日：宜の神煞があり、忌の神煞がない日（徳日・願日は軽い忌を打ち消す。月破は決して打ち消されない）。日をクリックすると暦で開きます。","ko":"책의 규칙(欽定協紀辨方書 권11): 宜 {yi}; 忌 {ji}. 적합: 宜 신살이 있고 忌 신살이 없는 날(덕일이나 원일은 가벼운 忌를 상쇄하며, 월파는 상쇄되지 않음). 날짜를 누르면 만세력에서 열립니다.","en":"rule from the book (欽定協紀辨方書, 卷十一): 宜 {yi}; 忌 {ji}. suitable: a 宜 star and no 忌 star (a 德 or 願 day cancels the soft 忌 stars; 月破 never cancels). click a day to open it in the almanac.","pinyin":""},{"id":"for_name","kind":"text","zh_hant":"{name} 的命盤","zh_hans":"{name} 的命盘","ja":"{name} の分","ko":"{name} 님","en":"for {name}","pinyin":""},{"id":"birth","kind":"text","zh_hant":"出生","zh_hans":"出生","ja":"出生","ko":"출생","en":"birth","pinyin":""},{"id":"birth_prompt","kind":"text","zh_hant":"請輸入出生日期和時間（使用本裝置的時區）","zh_hans":"请输入出生日期和时间（使用本设备的时区）","ja":"出生日時を入力してください（この端末のタイムゾーンを使用）","ko":"출생 날짜와 시각을 입력하세요(이 기기의 시간대를 사용)","en":"enter a birth date and time (uses this device's time zone)","pinyin":""},{"id":"exported","kind":"text","zh_hant":"已匯出 {n} 人","zh_hans":"已导出 {n} 人","ja":"{n} 人を書き出しました","ko":"{n}명을 내보냈습니다","en":"exported {n} people","pinyin":""},{"id":"imported","kind":"text","zh_hant":"已匯入 {n} 人","zh_hans":"已导入 {n} 人","ja":"{n} 人を読み込みました","ko":"{n}명을 ing, organizing, and managing resources.","pinyin":""},{"id":"desc_po","kind":"desc","zh_hans":"诸事不利，仅宜拆除旧物、手术了结，忌一切新事开展。","ja":"万事に不利。古いものの解体や手術、決着をつけることのみ向き、新しいことは避ける。","ko":"대부분의 일에 불길합니다. 철거나 마무리에만 알맞습니다.","en":"inauspicious for most activities. suited only for demolition or endings.","pinyin":""},{"id":"desc_wei","kind":"desc","zh_hans":"宜静不宜动，避免出行冒险，以静养祈福为要，待时而动。","ja":"静かに過ごすのがよく、動くのは不向き。危険な外出は避け、静養と祈願に努めて時を待つ。","ko":"여행과 위험한 일을 피하세요. 쉬면서 지켜보세요.","en":"avoid travel and risky undertakings. rest and observe.","pinyin":""},{"id":"desc_cheng","kind":"desc","zh_hans":"吉星拱照，诸事皆宜，尤利嫁娶开市、签约出行，大吉之日。","ja":"吉星が照らし、万事に向く。特に結婚、開業、契約、出行に良い大吉の日。","ko":"가장 길한 날 가운데 하나로, 거의 모든 일에 유리합니다.","en":"one of the most auspicious days - favorable for nearly all endeavors.","pinyin":""},{"id":"desc_shou","kind":"desc","zh_hans":"宜收获入仓、纳财成交，能量内聚，适合回收整合资源。","ja":"収穫や入庫、入金、成約に向く。気が内に集まり、資源の回収と整理に適する。","ko":"수확하고 대금을 받고 사람을 모으기에 좋습니다.","en":"good for harvesting, receiving payments, and gathering.","pinyin":""},{"id":"desc_kai","kind":"desc","zh_hans":"诸事开张，宜开业出行、嫁娶修造，生机勃发，万象更新。","ja":"万事が始まる日。開業や出行、結婚、造営に向き、生気が満ち、すべてが新たになる。","ko":"새로 열고 시작하고 첫걸음을 떼기에 길합니다.","en":"auspicious for new openings, launches, and beginnings.","pinyin":""},{"id":"desc_bi","kind":"desc","zh_hans":"宜收藏封存、结账了结，关闭循环，巩固守成。","ja":"収蔵や封印、決算、決着に向く。流れを閉じ、守りを固める。","ko":"닫고 봉하고 보관하기에 유리합니다.","en":"favorable for closing, sealing, and storing.","pinyin":""},{"id":"taboo_s0","kind":"taboo","zh_hans":"甲不开仓，财物耗散","ja":"甲の日は倉を開かない。財が散じる。","ko":"창고를 열지 마세요. 재물이 흩어집니다","en":"do not open storehouses - wealth will scatter","pinyin":""},{"id":"taboo_s1","kind":"taboo","zh_hans":"乙不栽植，千株不长","ja":"乙の日は植えない。千株も育たない。","ko":"심지 마세요. 싹이 뿌리내리지 못합니다","en":"do not plant - seedlings will not take root","pinyin":""},{"id":"taboo_s2","kind":"taboo","zh_hans":"丙不修灶，必见灾殃","ja":"丙の日はかまどを直さない。必ず災いが起こる。","ko":"아궁이를 고치지 마세요. 불운이 따릅니다","en":"do not repair stoves - misfortune will follow","pinyin":""},{"id":"taboo_s3","kind":"taboo","zh_hans":"丁不剃头，头主生疮","ja":"丁の日は髪を剃らない。頭に腫れ物ができる。","ko":"머리를 자르지 마세요. 머리에 종기가 납니다","en":"do not cut hair - sores will form on the head","pinyin":""},{"id":"taboo_s4","kind":"taboo","zh_hans":"戊不受田，田主不祥","ja":"戊の日は田を受け取らない。田の主に不吉。","ko":"땅을 받지 마세요. 땅 주인에게 불길합니다","en":"do not receive land - inauspicious for the landowner","pinyin":""},{"id":"taboo_s5","kind":"taboo","zh_hans":"己不破券，二比并亡","ja":"己の日は証文を破らない。双方が損をする。","ko":"계약을 깨지 마세요. 양쪽 모두 손해를 봅니다","en":"do not break contracts - both parties will suffer loss","pinyin":""},{"id":"taboo_s6","kind":"taboo","zh_hans":"庚不经络，织机虚张","ja":"庚の日は機織りをしない。織機が空しく張られるだけ。","ko":"베를 짜지 마세요. 베틀이 놀게 됩니다","en":"do not weave - the loom will sit idle","pinyin":""},{"id":"taboo_s7","kind":"taboo","zh_hans":"辛不合酱，主人不尝","ja":"辛の日は醤を仕込まない。主人は味わえない。","ko":"발효 음식을 만들지 마세요. 주인이 맛보지 못합니다","en":"do not make fermented foods - the host will not taste them","pinyin":""},{"id":"taboo_s8","kind":"taboo","zh_hans":"壬不泱水，更难提防","ja":"壬の日は水を流さない。災いを防ぎ難い。","ko":"물을 빼거나 돌리지 마세요. 재앙을 막기 어렵습니다","en":"do not drain or divert water - calamity is hard to prevent","pinyin":""},{"id":"taboo_s9","kind":"taboo","zh_hans":"癸不词讼，理弱敌强","ja":"癸の日は訴訟をしない。理は弱く、相手は強い。","ko":"소송하지 마세요. 내 쪽은 약하고 상대는 강합니다","en":"do not litigate - your case will be weak, the opponent strong","pinyin":""},{"id":"taboo_b0","kind":"taboo","zh_hans":"子不问卜，自惹祸殃","ja":"子の日は占わない。自ら災いを招く。","ko":"점치지 마세요. 어차피 불운이 찾아옵니다","en":"do not divine - misfortune will find you regardless","pinyin":""},{"id":"taboo_b1","kind":"taboo","zh_hans":"丑不冠带，主不还乡","ja":"丑の日は冠帯を着けない。主は故郷に帰れない。","ko":"정장을 입지 마세요. 입은 사람이 집에 돌아오지 못합니다","en":"do not wear formal attire - the wearer will not return home","pinyin":""},{"id":"taboo_b2","kind":"taboo","zh_hans":"寅不祭祀，神鬼不尝","ja":"寅の日は祭祀をしない。神霊は供物を受けない。","ko":"제사를 지내지 마세요. 신령이 제물을 받지 않습니다","en":"do not hold ceremonies - spirits will not receive the offering","pinyin":""},{"id":"taboo_b3","kind":"taboo","zh_hans":"卯不穿井，水泉不香","ja":"卯の日は井戸を掘らない。水が清らかでない。","ko":"우물을 파지 마세요. 물이 맑지 않습니다","en":"do not dig wells - the e_moon","kind":"text","zh_hant":"情感本性","zh_hans":"情感本性","ja":"感情面","ko":"감정적 성향","en":"emotional nature","pinyin":""},{"id":"role_rising","kind":"text","zh_hant":"給人的印象","zh_hans":"给人的印象","ja":"人に与える印象","ko":"남에게 보이는 인상","en":"how you come across","pinyin":""},{"id":"reading_note","kind":"text","zh_hant":"僅供自我反思，並非預測：以下是各星座的傳統聯想","zh_hans":"仅供自我反思，并非预测：以下是各星座的传统联想","ja":"自己を振り返るための材料で、予言ではありません。各星座の伝統的な連想です","ko":"성찰을 위한 참고일 뿐 예측이 아닙니다. 각 별자리에 대해 전해 내려오는 전통적인 연상입니다","en":"a prompt for reflection, not a forecast: these are the traditional associations of each sign","pinyin":""},{"id":"xing1_pan2_jie3_du2","kind":"section","zh_hant":"星盤解讀","zh_hans":"星盘解读","ja":"チャートの読み","ko":"차트 해석","en":"chart reading","pinyin":"xīng pán jiě dú"},{"id":"xing4_bie2","kind":"ui","zh_hant":"性別","zh_hans":"性别","ja":"性別","ko":"성별","en":"gender","pinyin":"xìng bié"},{"id":"nan2","kind":"ui","zh_hant":"男","zh_hans":"男","ja":"男性","ko":"남성","en":"male","pinyin":"nán"},{"id":"nv3_2","kind":"ui","zh_hant":"女","zh_hans":"女","ja":"女性","ko":"여성","en":"female","pinyin":"nǚ"},{"id":"shun4_xing2","kind":"ui","zh_hant":"順行","zh_hans":"顺行","ja":"順行","ko":"순행","en":"forward","pinyin":"shùn xíng"},{"id":"ni4_xing2","kind":"ui","zh_hant":"逆行","zh_hans":"逆行","ja":"逆行","ko":"역행","en":"backward","pinyin":"nì xíng"},{"id":"da4_yun4","kind":"section","zh_hant":"大運","zh_hans":"大运","ja":"大運","ko":"대운","en":"luck pillars","pinyin":"dà yùn"},{"id":"liu2_nian2","kind":"section","zh_hant":"流年","zh_hans":"流年","ja":"流年","ko":"세운","en":"yearly pillars","pinyin":"liú nián"},{"id":"luck_missing","kind":"text","zh_hant":"選擇性別即可查看大運","zh_hans":"选择性别即可查看大运","ja":"性別を選ぶと大運が表示されます","ko":"성별을 선택하면 대운이 표시됩니다","en":"choose a gender to see the luck pillars","pinyin":""},{"id":"luck_start","kind":"text","zh_hant":"第一步大運從 {y} 歲 {m} 個月起，{dir}排列，每步 10 年","zh_hans":"第一步大运从 {y} 岁 {m} 个月起，{dir}排列，每步 10 年","ja":"最初の大運は{y}歳{m}か月から始まり、{dir}で進みます。各10年","ko":"첫 대운은 {y}세 {m}개월에 시작하며 {dir}으로 진행되고, 각각 10년입니다","en":"the first luck pillar starts at age {y} years {m} months and runs {dir}; each lasts 10 years","pinyin":""},{"id":"luck_note","kind":"text","zh_hant":"大運從月柱起排：陽年男、陰年女順行，其餘逆行。起運歲數按出生到最近節氣的天數計算（3 天為 1 年）。各派細節不同，僅供參考","zh_hans":"大运从月柱起排：阳年男、阴年女顺行，其余逆行。起运岁数按出生到最近节气的天数计算（3 天为 1 年）。各派细节不同，仅供参考","ja":"大運は月柱から数え、陽年の男・陰年の女は順行、それ以外は逆行します。起運の年齢は最寄りの節気までの日数（3日で1年）から求めます。流派により細部が異なるため、目安としてご覧ください","ko":"대운은 월주에서 시작하며, 양년 남자와 음년 여자는 순행, 그 외는 역행합니다. 시작 나이는 가장 가까운 절기까지의 일수로 계산합니다(3일이 1년). 학파마다 세부가 다르므로 참고용으로 보세요","en":"luck pillars follow the month pillar: forward for a yang year stem with male or a yin year stem with female, otherwise backward. the start age counts the days to the nearest solar term (3 days is 1 year). schools differ on details, so treat it as a guide","pinyin":""},{"id":"luck_age","kind":"text","zh_hant":"{a} 歲","zh_hans":"{a} 岁","ja":"{a}歳","ko":"{a}세","en":"age {a}","pinyin":""},{"id":"why_q","kind":"text","zh_hant":"這是什麼意思？","zh_hans":"这是什么意思？","ja":"これは何？","ko":"이게 무슨 뜻이에요?","en":"what does this mean?","pinyin":""},{"id":"why_pillars","kind":"text","zh_hant":"四柱為出生年、月、日、時的干支：年柱、月柱以節（立春等十二節）為界，日柱以子時（23:00）換日。日干即日主，是排定其餘各干十神的基準；月令（月支）權重最大。","zh_hans":"四柱为出生年、月、日、时的干支：年柱、月柱以节（立春等十二节）为界，日柱以子时（23:00）换日。日干即日主，是排定其余各干十神的基准；月令（月支）权重最大。","ja":"四柱は生年・月・日・時の干支。年柱・月柱は節（立春など十二節）で区切り、日柱は子の刻（23:00）で日が変わります。日干が日主で、他の干の十神を定める基準です。月令（月支）が最も重く扱われます。","ko":"사주는 출생 연·월·일·시의 간지입니다. 연주와 월주는 절(입춘 등 12절)을 경계로 하고, 일주는 자시(23:00)에 날이 바뀝니다. 일간(日主)이 다른 간의 십신을 정하는 기준이며, 월령(월지)의 비중이 가장 큽니다.","en":"四柱: the sexagenary stem-branch pairs of the birth year, month, day and hour. year and month change at the 節 (the twelve jie, from 立春), the day at 子時 (23:00). the day stem is the 日主, the reference from which every other stem is given its ten-god relation; the month branch (月令) carries the most weight.","pinyin":""},{"id":"why_hidden","kind":"text","zh_hant":"藏干是地支中所藏之干，按子平通行表依本氣、中氣、餘氣排列（如寅：甲丙戊）。十神關係既看透干，也看藏干。","zh_hans":"藏干是地支中所藏之干，按子平通行表依本气、中气、余气排列（如寅：甲丙戊）。十神关系既看透干，也看藏干。","ja":"藏干は地支に蔵された干で、子平の通行表に従い本気・中気・余気の順に並べます（例：寅＝甲丙戊）。十神は天干だけでなく藏干にも取ります。","ko":"지장간은 지지 속에 갈무리된 천간으로, 자평의 통용표에 따라 본기·중기·여기 순으로 늘어놓습니다(예: 寅은 甲 丙 戊). 십신은 투출한 천간뿐 아니라 지장간에도 적용합니다.","en":"藏干 are the stems stored in each branch, listed 本氣, 中氣, 餘氣 (main, middle, residual qi) by the standard Ziping table (e.g. 寅: 甲 丙 戊). ten-god relations are read for them as well as for the visible stems.","pinyin":""},{"id":"x_bi3_jian1","kind":"text","zh_hant":"與日主五行相同、陰陽相同。與劫財合稱比劫：同輩之助，亦為爭財之力。","zh_hans":"与日主五行相同、阴阳相同。与劫财合称比劫：同辈之助，亦为争财之力。","ja":"日主と五行・陰陽が同じ。劫財と合わせて比劫。同輩の助けであり、財を争う力でもある。","ko":"일간과 오행·음양이 같음. 겁재와 합쳐 비겁이라 하며, 동료의 도움이자 재를 다투는 힘.","en":"same element and polarity as the day master. with 劫財 it forms 比劫: peer support, and rivals for 財.","pinyin":""},{"id":"x_jie2_cai2","kind":"text","zh_hant":"五行相同、陰陽相異。比劫分奪財；過多則為爭財、耗散資源。","zh_hans":"五行相同、阴阳相异。比劫分夺财；过多则为争财、耗散资源。","ja":"五行が同じで陰陽が逆。比劫は財を分け合い奪い合う。過多は爭財、資源の消耗を示す。","ko":"오행은 같고 음양은 다름. 비겁은 재를 나누고 다투며, 과하면 쟁재와 자원 소모를 뜻함.","en":"same element, opposite polarity. 比劫 share and contest 財; in excess they signal 爭財 and depleted resources.","pinyin":""},{"id":"x_shi2_shen2","kind":"text","zh_hant":"日主所生（我生），陰陽相同。較溫和的食傷：才藝、從容；可制七殺（食神制殺），忌偏印奪食（梟神奪食）。","zh_hans":"日主所生（我生），阴阳相同。较温和的食伤：才艺、从容；可制七杀（食神制杀），忌偏印夺食（枭神夺食）。","ja":"日主が生じる五行（我生）で陰陽が同じ。穏やかな食傷で、技芸とゆとり。七殺を制し（食神制殺）、偏印に奪われる（梟神奪食）。","ko":"일간이 생하는 오행(아생), 음양이 같음. 부드러운 식상으로 재주와 여유를 뜻하며, 칠살을 제어하고(식신제살) 편인에게 빼앗길 수 있음(효신탈식).","en":"the element the day master produces (我生), same polarity. the milder output star: skill, ease; it checks 七殺 (食神制殺) and can be blocked by 偏印 (梟神奪食).","pinyin":""},{"id":"x_shang1_guan1","kind":"text","zh_hant":"我生，陰陽相異。鋒利的食傷：才華與批判；傷官見官則害官星，傷官生財則化為財源。","zh_hans":"我生，阴阳相异。锋利的食伤：才华与批判；伤官见官则害官星，伤官生财则化为财源。","ja":"我生で陰陽が逆。鋭い食傷で、才能と批判。傷官見官は官星を害し、傷官生財は出力を財に転じる。","ko":"아생, 음양이 다름. 날카로운 식상으로 재능과 비판을 뜻하며, 상관견관은 관성을 해치고 상관생재는 산출을 재물로 돌림.","en":"我生, opposite polarity. the sharper output star: talent and critique. 傷官見官 harms the 官星; 傷官生財 channels the output into wealth.","pinyin":""},{"id":"x_pian1_cai2","kind":"text","zh_hant":"我剋，陰陽相同。流動不定之財：經商、意外之財；古法亦主父。","zh_hans":"我克，阴阳相同。流动不定之财：经商、意外之财；古法亦主父。","ja":"我剋で陰陽が同じ。流動的で不定の財：商い、思わぬ収入。古法では父も表す。","ko":"아극, 음양이 같음. 유동적이고 일정치 않은 재물: 장사, 뜻밖의 수입. 고법에서는 아버지도 나타냄.","en":"我剋, same polarity. mobile, irregular wealth: trade and windfalls; classically the father.","pinyin":""},{"id":"x_zheng4_cai2","kind":"text","zh_hant":"我剋，陰陽相異。正常、固定之財：薪俸、產業；男命亦為妻星。","zh_hans":"我克，阴阳相异。正常、固定之财：薪俸、产业；男命亦为妻星。","ja":"我剋で陰陽が逆。正規・固定の財：給与、資産。男命では妻星でもある。","ko":"아극, 음양이 다름. 정기적이고 고정된 재물: 봉급, 자산. 남명에서는 처성이기도 함.","en":"我剋, opposite polarity. regular, fixed wealth: salary and holdings; in a male chart also the wife star.","pinyin":""},{"id":"x_qi1_sha1","kind":"text","zh_hant":"剋我，陰陽相同（偏官）。無制之剋：壓力與魄力；須有制（食神制殺）或化（殺印相生）方可用。","zh_hans":"克我，阴阳相同（偏官）。无制之克：压力与魄力；须有制（食神制杀）或化（杀印相生）方可用。","ja":"剋我で陰陽が同じ（偏官）。制御のない剋で、重圧と気迫。制（食神制殺）か化（殺印相生）があって初めて用いられる。","ko":"극아, 음양이 같음(편관). 제어되지 않은 극으로 압박과 기백을 뜻하며, 제(식신제살)나 화(살인상생)가 있어야 쓸 수 있음.","en":"剋我, same polarity (偏官). control without restraint: pressure and drive; usable only when restrained (食神制殺) or transformed (殺印相生).","pinyin":""},{"id":"x_zheng4_guan1","kind":"text","zh_hant":"剋我，陰陽相異。有節制之剋：官職、紀律、名聲；女命為夫星；忌傷官。","zh_hans":"克我，阴阳相异。有节制之克：官职、纪律、名声；女命为夫星；忌伤官。","ja":"剋我で陰陽が逆。節度ある剋で、官職、規律、名声。女命では夫星。傷官を忌む。","ko":"극아, 음양이 다름. 절제된 극으로 관직, 규율, 명성을 뜻함. 여명에서는 부성이며 상관을 꺼림.","en":"剋我, opposite polarity. regulated control: office, discipline, reputation; the husband star in a female chart; harmed by 傷官.","pinyin":""},{"id":"x_pian1_yin4","kind":"text","zh_hant":"生我，陰陽相同（梟神）。非常規之助：專門或偏門之學；無制則奪食（梟神奪食）。","zh_hans":"生我，阴阳相同（枭神）。非常规之助：专门或偏门之学；无制则夺食（枭神夺食）。","ja":"生我で陰陽が同じ（梟神）。型破りな助けで、専門的・偏った学び。制がなければ食神を奪う（梟神奪食）。","ko":"생아, 음양이 같음(효신). 색다른 도움으로 전문적이거나 비주류의 학문. 제어가 없으면 식신을 빼앗음(효신탈식).","en":"生我, same polarity (梟神). unconventional support: specialist or unorthodox learning; it blocks 食神 (梟神奪食) when unchecked.","pinyin":""},{"id":"x_zheng4_yin4","kind":"text","zh_hant":"生我，陰陽相異。正常之助：學問、庇護、母親；過多則印重埋身。","zh_hans":"生我，阴阳相异。正常之助：学问、庇护、母亲；过多则印重埋身。","ja":"生我で陰陽が逆。正規の助けで、学問、庇護、母。過多は印重となり日主を埋もれさせる。","ko":"생아, 음양이 다름. 정규의 도움으로 학문, 보호, 어머니를 뜻하며, 지나치면 인중이 되어 일간을 묻어 버림.","en":"生我, opposite polarity. regular support: learning, protection, the mother; in excess it smothers the day master (印重).","pinyin":""},{"id":"x_mu4","kind":"text","zh_hant":"東方、春、仁；天干甲乙。生火，剋土，受金剋。","zh_hans":"东方、春、仁；天干甲乙。生火，克土，受金克。","ja":"東・春・仁、天干は甲乙。火を生じ、土を剋し、金に剋される。","ko":"동방·봄·인(仁), 천간은 갑을. 화를 생하고 토를 극하며 금에게 극을 받음.","en":"east, spring, 仁; stems 甲 乙. generates 火, controls 土, is controlled by 金.","pinyin":""},{"id":"x_huo3","kind":"text","zh_hant":"南方、夏、禮；天干丙丁。生土，剋金，受水剋。","zh_hans":"南方、夏、礼；天干丙丁。生土，克金，受水克。","ja":"南・夏・礼、天干は丙丁。土を生じ、金を剋し、水に剋される。","ko":"남방·여름·예(禮), 천간은 병정. 토를 생하고 금을 극하며 수에게 극을 받음.","en":"south, summer, 禮; stems 丙 丁. generates 土, controls 金, is controlled by 水.","pinyin":""},{"id":"x_tu3","kind":"text","zh_hant":"中央、四季之交（四季土）、信；天干戊己。生金，剋水，受木剋。","zh_hans":"中央、四季之交（四季土）、信；天干戊己。生金，克水，受木克。","ja":"中央・季節の変わり目（四季土）・信、天干は戊己。金を生じ、水を剋し、木に剋される。","ko":"중앙·환절기(사계토)·신(信), 천간은 무기. 금을 생하고 수를 극하며 목에게 극을 받음.","en":"centre, the turn of the seasons (四季土), 信; stems 戊 己. generates 金, controls 水, is controlled by 木.","pinyin":""},{"id":"x_jin1","kind":"text","zh_hant":"西方、秋、義；天干庚辛。生水，剋木，受火剋。","zh_hans":"西方、秋、义；天干庚辛。生水，克木，受火克。","ja":"西・秋・義、天干は庚辛。水を生じ、木を剋し、火に剋される。","ko":"서방·가을·의(義), 천간은 경신. 수를 생하고 목을 극하며 화에게 극을 받음.","en":"west, autumn, 義; stems 庚 辛. generates 水, controls 木, is controlled by 火.","pinyin":""},{"id":"x_shui3","kind":"text","zh_hant":"北方、冬、智；天干壬癸。生木，剋火，受土剋。","zh_hans":"北方、冬、智；天干壬癸。生木，克火，受土克。","ja":"北・冬・智、天干は壬癸。木を生じ、火を剋し、土に剋される。","ko":"북방·겨울·지(智), 천간은 임계. 목을 생하고 화를 극하며 토에게 극을 받음.","en":"north, winter, 智; stems 壬 癸. generates 木, controls 火, is controlled by 土.","pinyin":""},{"id":"why_strength","kind":"text","zh_hant":"只是計數，並非格局判斷：生扶（印與比劫，即日主同類與生我者）對洩耗剋（食傷、財、官殺），月令計雙倍。未計通根、合沖化及調候，僅作初篩；用神須另行判定。","zh_hans":"只是计数，并非格局判断：生扶（印与比劫，即日主同类与生我者）对泄耗克（食伤、财、官杀），月令计双倍。未计通根、合冲化及调候，仅作初筛；用神须另行判定。","ja":"格局の判断ではなく単純な計数です。生扶（印と比劫、すなわち日主と同じ五行と生じる五行）を、洩・耗・剋（食傷・財・官殺）と比べ、月令は2倍にします。通根、合冲の変化、調候は見ていないため、一次的な目安とし、用神は別に定めてください。","ko":"격국 판단이 아니라 단순 계수입니다. 생부(인성과 비겁, 곧 일간과 같은 오행과 일간을 생하는 오행)를 설기·소모·극하는 힘(식상·재·관살)과 견주며, 월령은 2배로 칩니다. 통근, 합충의 변화, 조후는 보지 않으므로 1차 선별로만 쓰고 용신은 따로 정하세요.","en":"a count, not a 格局 judgement: support (印 and 比劫: the day master's element and the one producing it) against drain (食傷, 財, 官殺), with the month branch doubled for 月令. it ignores 通根 (rooting in hidden stems), 合 and 沖 transformations and 調候 (season), so treat it as a first screen and settle 用神 separately.","pinyin":""},{"id":"why_luck","kind":"text","zh_hant":"大運自月柱起排：陽男陰女順排，陰男陽女逆排（以年干陰陽為準）。起運歲數 = 出生至下一節（順）或上一節（逆）的天數 ÷ 3（3 日為 1 年，1 日為 4 個月，1 時辰為 10 日），以節的準確時刻計。每步管十年，本頁不分干支上下半運。須與原局對照合、刑、沖、害及對用神的影響。","zh_hans":"大运自月柱起排：阳男阴女顺排，阴男阳女逆排（以年干阴阳为准）。起运岁数 = 出生至下一节（顺）或上一节（逆）的天数 ÷ 3（3 日为 1 年，1 日为 4 个月，1 时辰为 10 日），以节的准确时刻计。每步管十年，本页不分干支上下半运。须与原局对照合、刑、冲、害及对用神的影响。","ja":"大運は月柱から数え、陽男・陰女は順行、陰男・陽女は逆行します（年干の陰陽による）。起運年齢は、出生から次の節（順行）または前の節（逆行）までの日数÷3（3日＝1年、1日＝4か月、1時辰＝10日）で、節の正確な時刻から計算します。各柱は10年を司り、本ページでは干支の前半・後半には分けません。原局との合・刑・冲・害、用神への影響を照らして読みます。","ko":"대운은 월주에서 시작하며, 양남·음녀는 순행, 음남·양녀는 역행합니다(연간의 음양 기준). 기운 나이는 출생에서 다음 절(순행) 또는 이전 절(역행)까지의 일수÷3(3일=1년, 1일=4개월, 1시진=10일)이며 절의 정확한 시각으로 셉니다. 각 대운은 10년을 맡고, 이 페이지는 천간·지지 전후반으로 나누지 않습니다. 원국과 합·형·충·해, 용신에 미치는 영향을 견주어 읽습니다.","en":"大運 run from the month pillar: 順 for 陽男 and 陰女, 逆 for 陰男 and 陽女 (by year stem polarity). the 起運 age is the days to the next (順) or previous (逆) 節 divided by 3 (3 days = 1 year, 1 day = 4 months, one 時辰 = 10 days), from the exact 節 instant. each pillar governs ten years; this page does not split it into stem and branch halves. read each against the natal chart for 合 刑 沖 害 and its effect on the 用神.","pinyin":""},{"id":"why_year","kind":"text","zh_hant":"流年為該年的干支，以立春（約 2 月 4 日）為界而非 1 月 1 日；本頁按公曆年標示。須與原局及當前大運對照合、刑、沖、害及所帶十神（含與原局柱相同的伏吟、相沖的反吟）。","zh_hans":"流年为该年的干支，以立春（约 2 月 4 日）为界而非 1 月 1 日；本页按公历年标示。须与原局及当前大运对照合、刑、冲、害及所带十神（含与原局柱相同的伏吟、相冲的反吟）。","ja":"流年はその年の干支で、1月1日ではなく立春（2月4日ごろ）で切り替わります。本ページでは西暦年で表示しています。原局と現在の大運に照らして、合・刑・冲・害ともたらす十神を読みます（原局の柱と同じなら伏吟、冲なら反吟）。","ko":"세운은 그해의 간지로, 1월 1일이 아니라 입춘(2월 4일경)에 바뀌며, 이 페이지는 양력 연도로 표시합니다. 원국과 현재 대운에 견주어 합·형·충·해와 가져오는 십신을 읽습니다(원국 기둥과 같으면 복음, 충하면 반음).","en":"流年 is the year's stem-branch. it changes at 立春 (about 4 February), not on 1 January; this page labels it by calendar year. read it against the natal chart and the running 大運 for 合 刑 沖 害 and the ten gods it brings, including 伏吟 and 反吟 where it repeats or opposes a natal pillar.","pinyin":""},{"id":"why_balance","kind":"text","zh_hant":"按元素（火、土、風、水）與三種性質（本位、固定、變動）統計七政（太陽至土星）。未加權：不計廟旺、角宮與外行星，僅作氣質初篩。","zh_hans":"按元素（火、土、风、水）与三种性质（本位、固定、变动）统计七政（太阳至土星）。未加权：不计庙旺、角宫与外行星，仅作气质初筛。","ja":"七天体（太陽〜土星）を、エレメント（火・地・風・水）とモダリティ（活動・不動・柔軟）で集計したものです。ディグニティ、アンギュラリティ、外惑星は加味しない無加重の集計で、気質の一次的な目安にとどまります。","ko":"일곱 천체(태양~토성)를 원소(불·흙·공기·물)와 양태(활동·고정·변통)별로 집계한 것입니다. 디그니티, 앵귤러리티, 외행성을 반영하지 않은 무가중 집계이므로 기질을 가늠하는 1차 선별로만 쓰세요.","en":"a tally of the seven classical bodies (Sun to Saturn) by element (fire, earth, air, water) and modality (cardinal, fixed, mutable). unweighted: no dignities, angularity or outer planets, so use it as a temperament screen only.","pinyin":""},{"id":"why_houses","kind":"text","zh_hant":"整宮制：上升星座所在星座為第 1 宮，其後每個星座依次為下一宮，宮界與星座界重合（最古老的希臘化時期體系）。1、4、7、10 宮為角宮，2、5、8、11 宮為續宮，3、6、9、12 宮為落宮。不採用象限制（普拉西德、科赫）。","zh_hans":"整宫制：上升星座所在星座为第 1 宫，其后每个星座依次为下一宫，宫界与星座界重合（最古老的希腊化时期体系）。1、4、7、10 宫为角宫，2、5、8、11 宫为续宫，3、6、9、12 宫为落宫。不采用象限制（普拉西德、科赫）。","ja":"ホールサイン・ハウス：アセンダントのサインを第1ハウスとし、以降のサインを順に次のハウスとするため、ハウスの境はサインの境と一致します（最古のヘレニズム期の方式）。1・4・7・10はアンギュラー、2・5・8・11はサクシーダント、3・6・9・12はケイデントです。プラシーダスやコッホなどの象限式は使いません。","ko":"홀사인 하우스: 어센던트가 있는 별자리를 1하우스로 하고 이후 별자리를 차례로 다음 하우스로 삼으므로, 하우스 경계가 별자리 경계와 일치합니다(가장 오래된 헬레니즘 방식). 1·4·7·10은 앵귤러, 2·5·8·11은 석시던트, 3·6·9·12는 케이던트입니다. 플라시더스나 코흐 같은 사분 방식은 쓰지 않습니다.","en":"whole-sign houses: the Ascendant's sign is the 1st house and each following sign the next, so house boundaries coincide with sign boundaries (the oldest, Hellenistic system). houses 1, 4, 7, 10 are angular, 2, 5, 8, 11 succedent, 3, 6, 9, 12 cadent. no quadrant system (Placidus, Koch) is used.","pinyin":""},{"id":"why_rising","kind":"text","zh_hant":"上升點（AC）是出生時刻與地點東方地平線上升起的黃道度數，由地方恆星時、緯度與黃赤交角算出；約每 4 分鐘移動 1°，故出生時間須精確到數分鐘，度數才可靠。緯度超過 66° 不予計算。","zh_hans":"上升点（AC）是出生时刻与地点东方地平线上升起的黄道度数，由地方恒星时、纬度与黄赤交角算出；约每 4 分钟移动 1°，故出生时间须精确到数分钟，度数才可靠。纬度超过 66° 不予计算。","ja":"アセンダント（AC）は、出生の時刻と場所で東の地平線に昇る黄道度数で、地方恒星時、緯度、黄道傾斜角から求めます。約4分で1°進むため、度数を信頼するには出生時刻が数分以内の精度である必要があります。緯度66°を超える場所は計算しません。","ko":"어센던트(AC)는 출생 시각과 장소에서 동쪽 지평선에 떠오르는 황도 도수로, 지방 항성시·위도·황도경사로 구합니다. 약 4분마다 1°씩 움직이므로 도수를 믿으려면 출생 시각이 몇 분 이내로 정확해야 합니다. 위도 66°를 넘는 곳은 계산하지 않습니다.","en":"the Ascendant (AC) is the ecliptic degree rising on the eastern horizon at the birth instant and place, from local sidereal time, latitude and the obliquity of the ecliptic. it advances about 1° every 4 minutes, so the birth time must be accurate to a few minutes for a reliable degree. latitudes beyond 66° are refused.","pinyin":""},{"id":"why_mc","kind":"text","zh_hant":"天頂（MC）是出生時位於子午線上的黃道度數，由地方恆星時算出，主事業與社會地位。整宮制下不一定落在第 10 宮。","zh_hans":"天顶（MC）是出生时位于子午线上的黄道度数，由地方恒星时算出，主事业与社会地位。整宫制下不一定落在第 10 宫。","ja":"MCは出生時に子午線上にある黄道度数で、地方恒星時から求め、天職と社会的地位を示します。ホールサイン・ハウスでは第10ハウスに入るとは限りません。","ko":"MC는 출생 시 자오선 위에 있는 황도 도수로 지방 항성시에서 구하며, 천직과 사회적 위치를 나타냅니다. 홀사인 하우스에서는 10하우스에 들지 않을 수도 있습니다.","en":"the Midheaven (MC) is the ecliptic degree on the meridian at birth, from local sidereal time; it marks vocation and public standing. with whole-sign houses it need not fall in the 10th house.","pinyin":""},{"id":"x_tai4_yang2","kind":"text","zh_hant":"生命力、自我、權威。入廟於獅子座，旺於白羊座；晝間派之光。","zh_hans":"生命力、自我、权威。入庙于狮子座，旺于白羊座；昼间派之光。","ja":"活力、自我、権威。ドミサイルは獅子座、エグザルテーションは牡羊座。昼のセクトの光。","ko":"활력, 자아, 권위. 사자자리에서 도미사일, 양자리에서 이그절테이션. 낮 섹트의 빛.","en":"vitality, identity, authority. domicile Leo, exaltation Aries; the light of the day sect.","pinyin":""},{"id":"x_yue4_liang5","kind":"text","zh_hant":"心智、身體、習慣、大眾。入廟於巨蟹座，旺於金牛座；夜間派之光。","zh_hans":"心智、身体、习惯、大众。入庙于巨蟹座，旺于金牛座；夜间派之光。","ja":"心、身体、習慣、大衆。ドミサイルは蟹座、エグザルテーションは牡牛座。夜のセクトの光。","ko":"마음, 몸, 습관, 대중. 게자리에서 도미사일, 황소자리에서 이그절테이션. 밤 섹트의 빛.","en":"mind, body, habits, the public. domicile Cancer, exaltation Taurus; the light of the night sect.","pinyin":""},{"id":"x_shui3_xing1","kind":"text","zh_hant":"智力、言語、商業。入廟於雙子座與處女座，旺於處女座；不分晝夜派。","zh_hans":"智力、言语、商业。入庙于双子座与处女座，旺于处女座；不分昼夜派。","ja":"知性、言葉、商取引。ドミサイルは双子座と乙女座、エグザルテーションは乙女座。セクトは中立。","ko":"지성, 말, 상업. 쌍둥이자리·처녀자리에서 도미사일, 처녀자리에서 이그절테이션. 섹트는 중립.","en":"intellect, speech, commerce. domicile Gemini and Virgo, exaltation Virgo; neutral in sect.","pinyin":""},{"id":"x_jin1_xing1","kind":"text","zh_hant":"情感、吸引、和諧、愉悅。入廟於金牛座與天秤座，旺於雙魚座；夜間派之吉星。","zh_hans":"情感、吸引、和谐、愉悦。入庙于金牛座与天秤座，旺于双鱼座；夜间派之吉星。","ja":"愛情、魅力、調和、快楽。ドミサイルは牡牛座と天秤座、エグザルテーションは魚座。夜のセクトのベネフィック。","ko":"애정, 매력, 조화, 쾌락. 황소자리·천칭자리에서 도미사일, 물고기자리에서 이그절테이션. 밤 섹트의 길성.","en":"affection, attraction, harmony, pleasure. domicile Taurus and Libra, exaltation Pisces; the benefic of the night sect.","pinyin":""},{"id":"x_huo3_xing1","kind":"text","zh_hant":"行動力、衝突、勇氣、切割。傳統入廟於白羊座與天蠍座，旺於摩羯座；夜間派之凶星。","zh_hans":"行动力、冲突、勇气、切割。传统入庙于白羊座与天蝎座，旺于摩羯座；夜间派之凶星。","ja":"意欲、衝突、勇気、切断。伝統的ドミサイルは牡羊座と蠍座、エグザルテーションは山羊座。夜のセクトのマレフィック。","ko":"추진력, 갈등, 용기, 절단. 전통적으로 양자리·전갈자리에서 도미사일, 염소자리에서 이그절테이션. 밤 섹트의 흉성.","en":"drive, conflict, courage, cutting. domicile Aries and Scorpio (traditional), exaltation Capricorn; the malefic of the night sect.","pinyin":""},{"id":"x_mu4_xing1","kind":"text","zh_hant":"擴張、法律、信仰、福運。傳統入廟於射手座與雙魚座，旺於巨蟹座；大吉星，屬晝間派。","zh_hans":"扩张、法律、信仰、福运。传统入庙于射手座与双鱼座，旺于巨蟹座；大吉星，属昼间派。","ja":"拡大、法、信念、幸運。伝統的ドミサイルは射手座と魚座、エグザルテーションは蟹座。昼のセクトの大吉星（グレーター・ベネフィック）。","ko":"확장, 법, 신념, 행운. 전통적으로 궁수자리·물고기자리에서 도미사일, 게자리에서 이그절테이션. 낮 섹트의 대길성.","en":"expansion, law, belief, fortune. domicile Sagittarius and Pisces (traditional), exaltation Cancer; the greater benefic, of the day sect.","pinyin":""},{"id":"x_tu3_xing1","kind":"text","zh_hant":"約束、時間、結構、責任。傳統入廟於摩羯座與水瓶座，旺於天秤座；大凶星，屬晝間派。","zh_hans":"约束、时间、结构、责任。传统入庙于摩羯座与水瓶座，旺于天秤座；大凶星，属昼间派。","ja":"制約、時間、構造、責務。伝統的ドミサイルは山羊座と水瓶座、エグザルテーションは天秤座。昼のセクトの大凶星（グレーター・マレフィック）。","ko":"제약, 시간, 구조, 의무. 전통적으로 염소자리·물병자리에서 도미사일, 천칭자리에서 이그절테이션. 낮 섹트의 대흉성.","en":"restriction, time, structure, duty. domicile Capricorn and Aquarius (traditional), exaltation Libra; the greater malefic, of the day sect.","pinyin":""},{"id":"x_he2_xiang4","kind":"text","zh_hant":"0°，容許度 8°。兩星同宮；快星趨近慢星。作用依各自性質與廟旺而融合。","zh_hans":"0°，容许度 8°。两星同宫；快星趋近慢星。作用依各自性质与庙旺而融合。","ja":"0°、オーブ8°。2つの天体が同じサインにあり、速い方が遅い方に接近します。作用は両者の性質とディグニティに応じて混ざります。","ko":"0°, 오브 8°. 두 천체가 같은 별자리에 있고 빠른 쪽이 느린 쪽에 접근합니다. 작용은 각자의 성질과 디그니티에 따라 섞입니다.","en":"0°, orb 8°. the planets share a sign; the faster applies to the slower. effects blend according to their natures and dignities.","pinyin":""},{"id":"x_liu4_fen1_xiang4","kind":"text","zh_hant":"60°，容許度 5°。相隔兩宮、極性相合的星座（火風、土水）：協作，力度溫和。","zh_hans":"60°，容许度 5°。相隔两宫、极性相合的星座（火风、土水）：协作，力度温和。","ja":"60°、オーブ5°。2サイン離れた極性の合うサイン（火と風、地と水）：協力的で力は穏やか。","ko":"60°, 오브 5°. 두 별자리 떨어진 극성이 맞는 별자리(불-공기, 흙-물): 협조적이며 힘은 온건.","en":"60°, orb 5°. signs of compatible polarity two apart (fire-air, earth-water): cooperative, moderate in force.","pinyin":""},{"id":"x_si4_fen1_xiang4","kind":"text","zh_hant":"90°，容許度 7°。同一性質的星座：緊張，迫使行動的「硬」相位。","zh_hans":"90°，容许度 7°。同一性质的星座：紧张，迫使行动的“硬”相位。","ja":"90°、オーブ7°。同じモダリティのサイン：緊張を生み、行動を迫る「ハード」なアスペクト。","ko":"90°, 오브 7°. 같은 양태의 별자리: 긴장을 일으켜 행동을 강요하는 '하드' 애스펙트.","en":"90°, orb 7°. signs of the same modality: tension; the \"hard\" aspect that forces action.","pinyin":""},{"id":"x_san1_fen1_xiang4","kind":"text","zh_hant":"120°，容許度 8°。同一元素的星座：順暢流動，亦可能流於惰性。","zh_hans":"120°，容许度 8°。同一元素的星座：顺畅流动，亦可能流于惰性。","ja":"120°、オーブ8°。同じエレメントのサイン：容易さと流れ。惰性になることもあります。","ko":"120°, 오브 8°. 같은 원소의 별자리: 수월함과 흐름이지만 타성이 되기도 합니다.","en":"120°, orb 8°. signs of the same element: ease and flow, which can also mean inertia.","pinyin":""},{"id":"x_dui4_fen1_xiang4","kind":"text","zh_hant":"180°，容許度 8°。相對的星座（極性與性質相同）：兩極化、投射，需取得平衡。","zh_hans":"180°，容许度 8°。相对的星座（极性与性质相同）：两极化、投射，需取得平衡。","ja":"180°、オーブ8°。向かい合うサイン（極性とモダリティが同じ）：二極化、投影、バランスの必要。","ko":"180°, 오브 8°. 마주 보는 별자리(극성과 양태가 같음): 양극화, 투사, 균형의 필요.","en":"180°, orb 8°. opp // browser ui for the report: renders one day at a time, computed in the page by the app's own code (bundled by report.mjs). plain js, no deps.
const { meta } = DATA; // static tables only (宜/忌 per officer, labels); every day is computed live below
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayIso = iso(new Date());
// language: one shown at a time (en, zh-Hans, zh-Hant, ja, ko); a term shows only in that language, the other form is in its tooltip
const LANGS = ['en', 'zh-Hans', 'zh-Hant', 'ja', 'ko'];
const LOCALE = { en: 'en-GB', 'zh-Hans': 'zh-CN', 'zh-Hant': 'zh-TW', ja: 'ja-JP', ko: 'ko-KR' };
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang'); // ?lang=zh-Hans picks a language for a link or a test
  if (LANGS.includes(q)) return q;
  try { return localStorage.getItem('fo.lang') || 'en'; } catch { return 'en'; }
})();
const LABELS = {};
for (const l of meta.labels) { const k = l.kind === 'activity' ? 'star' : l.kind; const m = (LABELS[k] ??= new Map()); for (const key of [l.zh_hant, l.zh_hans]) if (key) m.set(key, l); } // stars and activities share a lookup; the same character can be an officer and a relation
const termParts = (zh, kind = 'star') => {
  const l = LABELS[kind]?.get(zh);
  if (!l) return { main: zh, other: '', title: zh };
  const hans = l.show_hans ?? l.zh_hans, hant = l.show_hant ?? l.zh_hant ?? hans; // a display override for a term whose modern name differs from the book's; the app's texts have no Traditional form yet, so 繁體 shows their Simplified
  const main = lang === 'zh-Hans' ? hans : lang === 'zh-Hant' ? hant : lang === 'ja' ? (l.ja ?? hant) : lang === 'ko' ? (l.ko ?? l.en) : l.en;
  const other = lang === 'en' ? hans : l.en; // the other form, shown only in the tooltip
  return { main, other, title: `${other} · ${l.pinyin} (${l.id})` };
};
// page text by id (kind text), in the chosen language, with {name} style placeholders filled from vars
const TEXT = new Map(meta.labels.filter((l) => l.kind === 'text').map((l) => [l.id, l]));
const T = (id, vars = {}) => {
  const l = TEXT.get(id);
  const s = l ? (lang === 'zh-Hans' ? l.zh_hans : lang === 'zh-Hant' ? l.zh_hant : lang === 'ja' ? l.ja : lang === 'ko' ? (l.ko ?? l.en) : l.en) : id;

const termMain = (zh, kind) => termParts(zh, kind).main;

const termHtml = (zh, kind) => { const t = termParts(zh, kind); return `<span title="${esc(t.title)}">${esc(t.main)}</span>`; };

// controls: prev/next/today buttons, the date picker, and clicking an hour
document.addEventListener('click', (e) => {
  const step = e.target.closest('[data-step]');
  const hour = e.target.closest('[data-b]');
  if (step) { cur = clampIso(addDays(cur, Number(step.dataset.step))); hourSel = null; render(); }

// luck pillars (大運) from the month pillar, and the pillars of last, this and next year; marks the one running now
const luckHtml = (b, when, dm) => {
  const gender = genderIn.value;
